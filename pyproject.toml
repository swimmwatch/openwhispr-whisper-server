[project]
name = "whisper-server-tooling"
version = "0.0.0"
description = "Private development, security and release tooling for the Whisper server"
requires-python = "==3.14.9"
dependencies = [
    "jsonschema==4.26.0",
    "PyYAML==6.0.3",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "ruff==0.17.2",
    "types-PyYAML==6.0.12.20260906",
]

[tool.uv]
package = false
required-version = "==0.13.5"

[tool.ruff]
target-version = "py314"
line-length = 100
include = ["tools/**/*.py", "tests/tooling/**/*.py", "pyproject.toml"]
extend-exclude = [".local", ".workflow"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.14"
files = ["tools", "tests/tooling"]
explicit_package_bases = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
