name: Release
run-name: Release ${{ github.event.release.tag_name || inputs.version_tag }}
'on':
  # Manual dispatch creates the GitHub Release after all channels succeed.
  # The published event operates on an already public, operator-created release.
  release:
    types:
    - published
  workflow_dispatch:
    inputs:
      version_tag:
        description: Existing release tag, for example v0.1.0-rc.1
        required: true
        type: string
permissions: {}
concurrency:
  group: whisper-artifact-publish
  cancel-in-progress: false
jobs:
  metadata:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: &runner ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      stage: ${{ steps.release.outputs.stage }}
      source-sha: ${{ steps.release.outputs.source-sha }}
      image-source: ${{ steps.release.outputs.image-source }}
      images-run: ${{ steps.release.outputs.images-run }}
    steps:
    - uses: &checkout actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Load shared CI configuration
      uses: &ci_config ./.github/actions/ci-config

    - name: Set up locked Python tooling
      uses: &setup_python ./.github/actions/setup-python
      with:
        cache: 'false'
        dev-dependencies: 'false'

    - name: Resolve tag and successful merged PR checks
      id: release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ github.event.release.tag_name || inputs.version_tag }}
      run: |
        uv run --no-sync --no-dev python tools/release/source.py   --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"   --output "$RUNNER_TEMP/release-source" --github-output "$GITHUB_OUTPUT"

    - uses: &upload_artifact actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: release-source
        path: ${{ runner.temp }}/release-source
        if-no-files-found: error
        include-hidden-files: true
        compression-level: ${{ env.CI_ARTIFACT_COMPRESSION_LEVEL }}
        retention-days: ${{ env.CI_PUBLICATION_RETENTION_DAYS }}
  build:
    name: build-${{ matrix.role }}
    needs: metadata
    if: needs.metadata.outputs.stage == 'candidate'
    runs-on: *runner
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        role:
        - api
        - backend
    steps:
    - uses: *checkout
      with:
        persist-credentials: false
        ref: ${{ needs.metadata.outputs.source-sha }}

    - name: Load shared CI configuration
      uses: *ci_config

    - name: Set up locked Python tooling
      uses: *setup_python
      with:
        cache: 'true'
        dev-dependencies: 'false'

    - name: Build cold release image
      uses: ./.github/actions/build-image
      with:
        role: ${{ matrix.role }}
        source-sha: ${{ needs.metadata.outputs.source-sha }}
        version: ${{ needs.metadata.outputs.version }}
        cold: 'true'

    - uses: *upload_artifact
      with:
        name: ${{ matrix.role }}
        path: |-
          ${{ runner.temp }}/artifacts/${{ matrix.role }}/image.tar
          ${{ runner.temp }}/artifacts/${{ matrix.role }}/image.json
        if-no-files-found: error
        include-hidden-files: true
        compression-level: ${{ env.CI_ARTIFACT_COMPRESSION_LEVEL }}
        retention-days: ${{ env.CI_PUBLICATION_RETENTION_DAYS }}
  chart:
    needs: metadata
    runs-on: *runner
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - uses: *checkout
      with:
        persist-credentials: false
        ref: ${{ needs.metadata.outputs.source-sha }}

    - name: Load shared CI configuration
      uses: *ci_config

    - name: Set up locked Python tooling
      uses: *setup_python
      with:
        cache: 'false'
        dev-dependencies: 'false'

    - uses: &cache_tools ./.github/actions/cache-tools

    - name: Install pinned Helm
      run: uv run --no-sync --no-dev python tools/install_ci.py --destination "$RUNNER_TEMP/chart-tools"
        --tools helm3 --download-cache "$CI_DOWNLOAD_CACHE_DIR" --jobs "$CI_TOOL_JOBS"

    - name: Package and render the release version
      env:
        SOURCE_SHA: ${{ needs.metadata.outputs.source-sha }}
        RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      run: |
        uv run --no-sync --no-dev python tools/release/artifacts.py chart   --helm "$RUNNER_TEMP/chart-tools/helm3" --source-sha "$SOURCE_SHA"   --version "$RELEASE_VERSION" --output "$RUNNER_TEMP/artifacts/chart"

    - uses: *upload_artifact
      with:
        name: chart
        path: ${{ runner.temp }}/artifacts/chart
        if-no-files-found: error
        include-hidden-files: true
        compression-level: ${{ env.CI_ARTIFACT_COMPRESSION_LEVEL }}
        retention-days: ${{ env.CI_PUBLICATION_RETENTION_DAYS }}
  image-runtime:
    needs:
    - metadata
    - build
    - chart
    if: needs.metadata.outputs.stage == 'candidate'
    permissions:
      contents: read
    uses: ./.github/workflows/image-runtime.yml
    with:
      source-sha: ${{ needs.metadata.outputs.source-sha }}
  publish:
    if: ${{ !cancelled() && needs.metadata.result == 'success' && needs.chart.result == 'success' && ((needs.build.result
      == 'success' && needs.image-runtime.result == 'success') || needs.metadata.outputs.stage == 'stable')
      }}
    runs-on: *runner
    timeout-minutes: 120
    environment: release
    outputs:
      images-run: ${{ needs.metadata.outputs.images-run }}
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      INVENTORY: .local/release/inventory.json
      STAGE: ${{ needs.metadata.outputs.stage }}
    steps:
    - uses: *checkout
      with:
        persist-credentials: false
        ref: ${{ needs.metadata.outputs.source-sha }}

    - name: Load shared CI configuration
      uses: *ci_config

    - name: Set up locked Python tooling
      uses: *setup_python
      with:
        cache: 'false'
        dev-dependencies: 'false'

    - uses: &download_artifact actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: release-source
        path: ${{ runner.temp }}/release-source

    - name: Cache verified tool downloads
      uses: *cache_tools

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go.mod
        cache: true
        cache-dependency-path: go.sum

    - uses: *download_artifact
      with:
        github-token: ${{ github.token }}
        name: chart
        path: ${{ runner.temp }}/current/chart

    - uses: *download_artifact
      with:
        run-id: ${{ needs.metadata.outputs.images-run }}
        github-token: ${{ github.token }}
        name: api
        path: ${{ runner.temp }}/accepted/api

    - uses: *download_artifact
      with:
        run-id: ${{ needs.metadata.outputs.images-run }}
        github-token: ${{ github.token }}
        name: backend
        path: ${{ runner.temp }}/accepted/backend

    - uses: *download_artifact
      with:
        run-id: ${{ needs.metadata.outputs.images-run }}
        github-token: ${{ github.token }}
        name: chart
        path: ${{ runner.temp }}/accepted/chart
      if: needs.metadata.outputs.stage == 'stable'

    - name: Cache vulnerability database only
      uses: ./.github/actions/cache-trivy-db

    - name: Set up verified Trivy
      uses: ./.github/actions/setup-trivy
      with:
        destination: ${{ runner.temp }}/release-tools
        cache: 'false'

    - name: Qualify tagged artifacts before publication
      env:
        GH_TOKEN: ${{ github.token }}
        IMAGE_SOURCE: ${{ needs.metadata.outputs.image-source }}
      run: |
        uv run --no-sync --no-dev python tools/install_ci.py --destination "$RUNNER_TEMP/release-tools" --tools helm3 buildx govulncheck gosec hadolint --download-cache "$CI_DOWNLOAD_CACHE_DIR" --jobs "$CI_TOOL_JOBS"
        echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"
        uv run --no-sync --no-dev python tools/release/artifacts.py unpack --artifacts "$RUNNER_TEMP/accepted" --images-only
        approved=()
        if [ "$STAGE" = stable ]; then
          approved=(--approved "$RUNNER_TEMP/release-source/approved.json")
        fi
        uv run --no-sync --no-dev python tools/release/inventory.py assemble   --inventory "$INVENTORY" --source "$RUNNER_TEMP/release-source/source.json"   --current "$RUNNER_TEMP/current" --accepted "$RUNNER_TEMP/accepted"   --output "$RUNNER_TEMP/artifacts" --helm "$RUNNER_TEMP/release-tools/helm3" "${approved[@]}"
        uv run --no-sync --no-dev python tools/security/run.py --artifacts "$RUNNER_TEMP/artifacts" --bin "$RUNNER_TEMP/release-tools" --image-source-sha "$IMAGE_SOURCE" --output "$RUNNER_TEMP/selected-security.json" --db-cache "$CI_TRIVY_CACHE_DIR"
        uv run --no-sync --no-dev python tools/release/inventory.py qualify --inventory "$INVENTORY" --security "$RUNNER_TEMP/selected-security.json" --stage "$STAGE"

    - uses: *upload_artifact
      with:
        name: release-inventory
        path: |-
          ${{ env.INVENTORY }}
          ${{ runner.temp }}/selected-security.json
        if-no-files-found: error
        include-hidden-files: true
        compression-level: ${{ env.CI_ARTIFACT_COMPRESSION_LEVEL }}
        retention-days: ${{ env.CI_PUBLICATION_RETENTION_DAYS }}

    - name: Prepare task-local Docker authentication
      run: |
        umask 077
        mkdir -p "$RUNNER_TEMP/docker-auth"
        echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-auth" >> "$GITHUB_ENV"
        echo "HELM_REGISTRY_CONFIG=$RUNNER_TEMP/helm-auth.json" >> "$GITHUB_ENV"

    - name: Authenticate Docker registry ghcr.io
      uses: &docker_login docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
      env:
        DOCKER_CONFIG: ${{ runner.temp }}/docker-auth
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
        logout: true

    - name: Authenticate Docker registry docker.io
      uses: *docker_login
      env:
        DOCKER_CONFIG: ${{ runner.temp }}/docker-auth
      with:
        registry: docker.io
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        logout: true

    - name: Authenticate Helm OCI registry
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        printf '%s' "$GH_TOKEN" | "$RUNNER_TEMP/release-tools/helm3" registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

    - name: Copy selected images unchanged and verify anonymous reads
      run: uv run --no-sync --no-dev python tools/release/publish.py --inventory "$INVENTORY" --stage
        "$STAGE" --artifacts "$RUNNER_TEMP/artifacts" --state "$RUNNER_TEMP/channel-state.json" --channel
        images

    - name: Publish the identical chart archive to OCI
      run: uv run --no-sync --no-dev python tools/release/publish.py --inventory "$INVENTORY" --stage
        "$STAGE" --artifacts "$RUNNER_TEMP/artifacts" --state "$RUNNER_TEMP/channel-state.json" --channel
        chart --helm "$RUNNER_TEMP/release-tools/helm3"

    - name: Preserve partial channel state
      if: ${{ always() }}
      uses: *upload_artifact
      with:
        name: publication-state
        overwrite: true
        path: ${{ runner.temp }}/channel-state.json
        if-no-files-found: error
        retention-days: ${{ env.CI_PUBLICATION_RETENTION_DAYS }}

    - name: Remove task-local credentials
      if: ${{ always() }}
      run: |
        rm -rf "$DOCKER_CONFIG"
        rm -f "$HELM_REGISTRY_CONFIG"
    needs:
    - metadata
    - build
    - chart
    - image-runtime
  pages:
    needs:
    - metadata
    - publish
    runs-on: *runner
    timeout-minutes: 30
    environment: release-pages
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    env:
      INVENTORY: .local/release/channel-state.json
      STAGE: ${{ needs.metadata.outputs.stage }}
    steps:
    - uses: *checkout
      with:
        persist-credentials: false
        ref: ${{ needs.metadata.outputs.source-sha }}

    - name: Load shared CI configuration
      uses: *ci_config

    - name: Set up locked Python tooling
      uses: *setup_python
      with:
        cache: 'false'
        dev-dependencies: 'false'

    - name: Cache verified tool downloads
      uses: *cache_tools

    - uses: *download_artifact
      with:
        name: publication-state
        path: .local/release

    - uses: *download_artifact
      with:
        github-token: ${{ github.token }}
        name: chart
        path: ${{ runner.temp }}/artifacts/chart

    - name: Prepare merged Pages index using the existing publication branch
      run: |
        uv run --no-sync --no-dev python tools/install_ci.py --destination "$RUNNER_TEMP/release-tools" --tools helm3 --download-cache "$CI_DOWNLOAD_CACHE_DIR" --jobs "$CI_TOOL_JOBS"
        git fetch origin gh-pages
        git worktree add --detach "$RUNNER_TEMP/pages" FETCH_HEAD
        uv run --no-sync --no-dev python tools/release/publish.py --inventory "$INVENTORY" --stage "$STAGE" --artifacts "$RUNNER_TEMP/artifacts" --state "$INVENTORY" --channel pages-prepare --pages-dir "$RUNNER_TEMP/pages" --helm "$RUNNER_TEMP/release-tools/helm3"

    - name: Publish Pages branch without rewriting existing history
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        git -C "$RUNNER_TEMP/pages" config user.name github-actions\[bot\]
        git -C "$RUNNER_TEMP/pages" config user.email 41898282+github-actions\[bot\]@users.noreply.github.com
        git -C "$RUNNER_TEMP/pages" add -- index.yaml whisper-server-*.tgz
        if ! git -C "$RUNNER_TEMP/pages" diff --cached --quiet; then
          git -C "$RUNNER_TEMP/pages" commit -m 'chore(release): publish selected Helm archive'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)
          git -C "$RUNNER_TEMP/pages" -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:gh-pages
        fi

    - name: Upload merged site for explicit Pages deployment
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
      with:
        path: ${{ runner.temp }}/pages

    - name: Deploy merged Pages artifact
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

    - name: Verify anonymous Pages archive and index
      run: |
        uv run --no-sync --no-dev python tools/release/publish.py --inventory "$INVENTORY" --stage "$STAGE" --artifacts "$RUNNER_TEMP/artifacts" --state "$INVENTORY" --channel pages-verify
        if [ "$STAGE" = candidate ]; then
          uv run --no-sync --no-dev python tools/release/check.py --inventory "$INVENTORY" --stage "$STAGE"
        fi

    - name: Preserve final or partial publication state
      if: ${{ always() }}
      uses: *upload_artifact
      with:
        name: final-publication-state
        overwrite: true
        path: ${{ env.INVENTORY }}
        if-no-files-found: error
        retention-days: ${{ env.CI_PUBLICATION_RETENTION_DAYS }}
  aliases:
    needs:
    - metadata
    - publish
    - pages
    if: needs.metadata.outputs.stage == 'stable'
    runs-on: *runner
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      INVENTORY: .local/release/channel-state.json
      STAGE: stable
    steps:
    - uses: *checkout
      with:
        persist-credentials: false
        ref: ${{ needs.metadata.outputs.source-sha }}

    - name: Load shared CI configuration
      uses: *ci_config

    - name: Set up locked Python tooling
      uses: *setup_python
      with:
        cache: 'false'
        dev-dependencies: 'false'

    - name: Cache verified tool downloads
      uses: *cache_tools

    - uses: *download_artifact
      with:
        name: final-publication-state
        path: .local/release

    - uses: *download_artifact
      with:
        run-id: ${{ needs.publish.outputs.images-run }}
        github-token: ${{ github.token }}
        name: api
        path: ${{ runner.temp }}/artifacts/api

    - uses: *download_artifact
      with:
        run-id: ${{ needs.publish.outputs.images-run }}
        github-token: ${{ github.token }}
        name: backend
        path: ${{ runner.temp }}/artifacts/backend

    - name: Install and verify immutable alias inputs
      run: |
        uv run --no-sync --no-dev python tools/install_ci.py --destination "$RUNNER_TEMP/release-tools" --tools buildx --download-cache "$CI_DOWNLOAD_CACHE_DIR" --jobs "$CI_TOOL_JOBS"
        echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"
        uv run --no-sync --no-dev python tools/release/artifacts.py unpack --artifacts "$RUNNER_TEMP/artifacts" --images-only

    - name: Prepare task-local Docker authentication
      run: |
        umask 077
        mkdir -p "$RUNNER_TEMP/docker-auth"

    - name: Authenticate Docker registry ghcr.io
      uses: *docker_login
      env:
        DOCKER_CONFIG: ${{ runner.temp }}/docker-auth
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
        logout: true

    - name: Authenticate Docker registry docker.io
      uses: *docker_login
      env:
        DOCKER_CONFIG: ${{ runner.temp }}/docker-auth
      with:
        registry: docker.io
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        logout: true

    - name: Find the original alias snapshot for this workflow run
      id: alias-recovery
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        SNAPSHOT_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=stable-alias-snapshot&per_page=100" --jq '.artifacts | if length == 0 then "" elif length == 1 and .[0].expired == false then .[0].id else error("Ambiguous or expired alias snapshot") end')"
        printf 'artifact-id=%s\n' "$SNAPSHOT_ID" >> "$GITHUB_OUTPUT"

    - name: Restore the original alias snapshot on retry
      if: steps.alias-recovery.outputs.artifact-id != ''
      uses: *download_artifact
      with:
        artifact-ids: ${{ steps.alias-recovery.outputs.artifact-id }}
        path: .local/release
        merge-multiple: true

    - name: Prepare alias rollback before any registry writes
      if: steps.alias-recovery.outputs.artifact-id == ''
      run: uv run --no-sync --no-dev python tools/release/publish.py --inventory "$INVENTORY" --stage
        stable --artifacts "$RUNNER_TEMP/artifacts" --state "$INVENTORY" --channel aliases-prepare

    - name: Persist the original alias snapshot before registry writes
      if: steps.alias-recovery.outputs.artifact-id == ''
      uses: *upload_artifact
      with:
        name: stable-alias-snapshot
        path: ${{ env.INVENTORY }}
        if-no-files-found: error
        retention-days: ${{ env.CI_PUBLICATION_RETENTION_DAYS }}

    - name: Finalize qualified stable aliases
      env:
        DOCKER_CONFIG: ${{ runner.temp }}/docker-auth
      run: |
        uv run --no-sync --no-dev python tools/release/publish.py --inventory "$INVENTORY" --stage stable --artifacts "$RUNNER_TEMP/artifacts" --state "$INVENTORY" --channel aliases
        uv run --no-sync --no-dev python tools/release/check.py --inventory "$INVENTORY" --stage stable

    - name: Preserve complete or partial stable state
      if: ${{ always() }}
      uses: *upload_artifact
      with:
        name: stable-publication-state
        overwrite: true
        path: ${{ env.INVENTORY }}
        if-no-files-found: warn
        retention-days: ${{ env.CI_PUBLICATION_RETENTION_DAYS }}

    - name: Remove task-local registry credentials
      if: ${{ always() }}
      run: rm -rf "$RUNNER_TEMP/docker-auth"
  github-release:
    needs:
    - metadata
    - pages
    - aliases
    if: ${{ !cancelled() && needs.pages.result == 'success' && (needs.metadata.outputs.stage == 'candidate'
      || needs.aliases.result == 'success') }}
    runs-on: *runner
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
    - uses: *checkout
      with:
        persist-credentials: false
        ref: ${{ needs.metadata.outputs.source-sha }}

    - name: Load shared CI configuration
      uses: *ci_config

    - name: Set up locked Python tooling
      uses: *setup_python
      with:
        cache: 'false'
        dev-dependencies: 'false'

    - uses: *download_artifact
      with:
        name: ${{ needs.metadata.outputs.stage == 'stable' && 'stable-publication-state' || 'final-publication-state'
          }}
        path: ${{ runner.temp }}

    - uses: *download_artifact
      with:
        name: chart
        path: ${{ runner.temp }}/artifacts/chart

    - name: Verify final publication state
      env:
        STAGE: ${{ needs.metadata.outputs.stage }}
      run: uv run --no-sync --no-dev python tools/release/check.py --inventory "$RUNNER_TEMP/channel-state.json"
        --stage "$STAGE"

    - name: Create or complete GitHub Release assets
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        RELEASE_STAGE: ${{ needs.metadata.outputs.stage }}
        STATE_FILE: ${{ runner.temp }}/channel-state.json
        CHART_DIR: ${{ runner.temp }}/artifacts/chart
      run: bash tools/release/upload-assets.sh
