name: Bug report or support question
description: Report an ordinary bug or ask a configuration question.
body:
  - type: markdown
    attributes:
      value: "For suspected vulnerabilities, use [private reporting](https://github.com/swimmwatch/openwhispr-whisper-server/security/advisories/new), not an issue. Start with the [operator guide](https://github.com/swimmwatch/openwhispr-whisper-server/blob/main/docs/operations.md). Never include credentials, private paths/cluster identities, audio or transcripts. Use synthetic or public reproductions and sanitized logs."
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Release/source revision, exact API/backend image and chart identities, GPU/driver, Docker/Compose or Kubernetes/Helm versions. Omit private host/cluster identifiers.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction or question
      description: Minimal steps and sanitized configuration.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Include readiness state and HTTP status/error code when relevant. Distinguish failed, skipped and unavailable checks; do not paste private response content.
    validations:
      required: true
