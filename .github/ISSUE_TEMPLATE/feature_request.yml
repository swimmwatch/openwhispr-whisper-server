name: Feature request
description: Propose a focused improvement.
body:
  - type: markdown
    attributes:
      value: "Never include credentials, private audio or transcripts. Changes to approved scope need agreement before implementation."
  - type: textarea
    id: problem
    attributes:
      label: Problem and use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and alternatives
    validations:
      required: true
