name: Feature request
description: Propose a focused improvement.
body:
  - type: markdown
    attributes:
      value: "Check the [Resident V1 scope and future work](https://github.com/swimmwatch/openwhispr-whisper-server/blob/main/README.md#future-work) first. Explain the user need without treating deferred features as delivered. Never include credentials, private audio or transcripts. Changes to approved scope need agreement before implementation."
  - type: textarea
    id: problem
    attributes:
      label: Problem and use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and alternatives
    validations:
      required: true
