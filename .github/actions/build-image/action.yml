name: Build Whisper image
description: Build and verify one OCI image with isolated Buildx and preserved attestations
inputs:
  role:
    description: 'Image role: api or backend'
    required: true
  source-sha:
    description: Checked out source revision
    required: true
  version:
    description: Release version; omitted for development builds
    default: ''
  cold:
    description: Disable all imported and exported build caches
    default: 'false'
  cache-access:
    description: 'Registry layer cache access: none, read or trusted-main write'
    default: read
outputs:
  digest:
    description: Verified OCI index digest
    value: ${{ steps.image.outputs.digest }}
runs:
  using: composite
  steps:
  - name: Set up isolated parallel Buildx
    id: builder
    uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
    with:
      version: ${{ env.CI_BUILDX_VERSION }}
      name: whisper-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.role }}
      driver: docker-container
      driver-opts: image=${{ env.CI_BUILDKIT_IMAGE }}
      buildkitd-flags: --root=/var/lib/buildkit
      buildkitd-config-inline: |
        [worker.oci]
          max-parallelism = ${{ env.CI_BUILD_PARALLELISM }}
      cache-binary: true
      keep-state: false
      cleanup: true

  - name: Prepare registry cache policy and image export
    id: cache
    env:
      ROLE: ${{ inputs.role }}
      COLD_BUILD: ${{ inputs.cold }}
      CACHE_ACCESS: ${{ inputs.cache-access }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF: ${{ github.ref }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GITHUB_RUN_ID: ${{ github.run_id }}
      GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
    run: |
      set -euo pipefail
      mkdir -p "$RUNNER_TEMP/artifacts/$ROLE"
      if [ "$COLD_BUILD" = true ]; then
        CACHE_ACCESS=none
      fi
      uv run --no-sync --no-dev python tools/build_cache.py prepare \
        --role "$ROLE" --repository "$CI_BUILD_CACHE_REPOSITORY" \
        --platform "$CI_IMAGE_PLATFORM" --access "$CACHE_ACCESS" \
        --output "$RUNNER_TEMP/artifacts/$ROLE/cache.json" --github-output "$GITHUB_OUTPUT"
    shell: bash

  - name: Generate OCI labels and registry annotations
    id: metadata
    uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
    env:
      DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
      IMAGE_METADATA: |
        org.opencontainers.image.title=openwhispr-whisper-server-${{ inputs.role }}
        org.opencontainers.image.description=${{ inputs.role == 'api' && 'Resident Whisper public API and bounded FFmpeg decoder' || 'Resident Whisper supervisor and unchanged CUDA native server' }}
        org.opencontainers.image.authors=openwhispr-whisper-server contributors
        org.opencontainers.image.vendor=openwhispr-whisper-server contributors
        org.opencontainers.image.url=https://github.com/${{ github.repository }}
        org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/${{ inputs.source-sha }}/docs/container-builds.md
        org.opencontainers.image.source=https://github.com/${{ github.repository }}
        org.opencontainers.image.version=${{ inputs.version || format('0.0.0-dev+sha.{0}', inputs.source-sha) }}
        org.opencontainers.image.revision=${{ inputs.source-sha }}
        org.opencontainers.image.licenses=${{ inputs.role == 'api' && 'Apache-2.0 AND MIT AND BSD-3-Clause AND LGPL-2.1-or-later' || 'Apache-2.0 AND MIT AND BSD-3-Clause AND LicenseRef-NVIDIA-CUDA' }}
    with:
      tags: type=sha,format=long
      flavor: latest=false
      labels: ${{ env.IMAGE_METADATA }}
      annotations: ${{ env.IMAGE_METADATA }}

  - name: Build GPU-free image with actual SBOM and provenance
    id: image
    uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
    env:
      DOCKER_BUILD_SUMMARY: 'false'
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    with:
      builder: ${{ steps.builder.outputs.name }}
      context: .
      file: containers/${{ inputs.role }}.Dockerfile
      platforms: ${{ env.CI_IMAGE_PLATFORM }}
      build-args: |
        SOURCE_REVISION=${{ inputs.source-sha }}
        APP_VERSION=${{ fromJSON(steps.metadata.outputs.json).labels['org.opencontainers.image.version'] }}
      labels: ${{ steps.metadata.outputs.labels }}
      annotations: ${{ steps.metadata.outputs.annotations }}
      outputs: type=oci,dest=${{ runner.temp }}/artifacts/${{ inputs.role }}/image.tar
      provenance: mode=max
      attests: type=sbom,generator=${{ env.CI_SBOM_GENERATOR }}
      push: false
      no-cache: ${{ inputs.cold == 'true' }}
      # Only the trusted cache workflow requests writes. Cold builds get neither.
      cache-from: ${{ steps.cache.outputs.cache-from }}
      cache-to: ${{ steps.cache.outputs.cache-to }}

  - name: Verify and record exported image identities
    env:
      IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
      ROLE: ${{ inputs.role }}
      SOURCE_SHA: ${{ inputs.source-sha }}
      COLD_BUILD: ${{ inputs.cold }}
    run: |
      set -euo pipefail
      qualification=()
      if [ "$COLD_BUILD" = true ]; then
        qualification=(--cold)
      fi
      uv run --no-sync --no-dev python tools/release/artifacts.py record-image \
        --output "$RUNNER_TEMP/artifacts/$ROLE" --source-sha "$SOURCE_SHA" \
        --expected-digest "$IMAGE_DIGEST" --role "$ROLE" \
        --cache-record "$RUNNER_TEMP/artifacts/$ROLE/cache.json" "${qualification[@]}"
    shell: bash

  - name: Promote verified staging cache and read back its digest
    if: inputs.cold != 'true' && inputs.cache-access == 'write'
    env:
      ROLE: ${{ inputs.role }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF: ${{ github.ref }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GITHUB_RUN_ID: ${{ github.run_id }}
      GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
    run: uv run --no-sync --no-dev python tools/build_cache.py promote --record "$RUNNER_TEMP/artifacts/$ROLE/cache.json"
    shell: bash
