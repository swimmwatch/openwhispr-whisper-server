  - category: upstream-gpu-evidence
    state: observed
    provenance: repository
    fact: At upstream whisper.cpp commit 6ac14546046ffb17d144a08bcad65337e535cf5, the packaged CUDA Dockerfile uses CUDA 13.0.0 and explicitly requests architectures 75;80;86;90. The CUDA backend CMake default includes older architectures only for CUDA <13 and includes additional Blackwell architectures for sufficiently recent CUDA. Thus support of source builds and one prebuilt CUDA image are not identical. No GPU runtime check was performed.
    evidence:
