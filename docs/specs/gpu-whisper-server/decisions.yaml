  - category: upstream-resident-request-state-evidence
    state: observed
    provenance: repository
    fact: At pinned upstream revision 6ac14546046ffb17d144a08bcad65337e535cf5, whisper_state owns result_all and prompt history. The HTTP inference handler builds its response and returns without clearing result_all; whisper_full_with_state clears old results at the beginning of the next invocation. Server defaults include no_context=true. The existing HTTP API has no result-only cleanup operation, so immediate internal result erasure after a successful response is not supplied by the unchanged Resident server. This is source evidence, not runtime proof of bounded memory, complete byte erasure, or cross-request isolation.
    evidence:
      - https://github.com/OpenWhispr/whisper.cpp/blob/6ac14546046ffb17d144a08bcad65337e535cf5/src/whisper.cpp#L881-L892
      - https://github.com/OpenWhispr/whisper.cpp/blob/6ac14546046ffb17d144a08bcad65337e535cf5/src/whisper.cpp#L6813-L6829
      - https://github.com/OpenWhispr/whisper.cpp/blob/6ac14546046ffb17d144a08bcad65337e535cf5/examples/server/server.cpp#L1007-L1162
      - https://github.com/OpenWhispr/whisper.cpp/blob/6ac14546046ffb17d144a08bcad65337e535cf5/examples/server/server.cpp#L109
