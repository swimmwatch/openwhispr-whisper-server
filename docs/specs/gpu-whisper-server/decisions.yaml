  - category: upstream-lifecycle-baseline
    state: observed
    provenance: repository
    fact: At pinned upstream commit 6ac14546046ffb17d144a08bcad65337e535cf5, whisper-server loads one model before serving and offers a /load replacement route, without a public unload route or authentication check. The public C API can initialize from an operator-owned byte buffer and free a whole context; this source evidence supports investigating RAM-backed reinitialization, but does not prove actual RAM/VRAM release or any runtime performance. Inference algorithms need not be changed by the requested service lifecycle.
