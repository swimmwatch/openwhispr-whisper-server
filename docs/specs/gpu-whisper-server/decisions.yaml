ement_ids: [ REQ-012, REQ-013, REQ-021 ], source_refs: [] }, { item_index: 11, item_key: source:af844c8a-a98c-4536-a079-9c3850131ac0, verdict: covered, explanation: "Configurable download/served sets, prepared/downloaded cache and lifecycle modes are preserved; Resident executes now while future warmup/RAM-cache/on-demand and reclamation remain explicit under the later narrowing.", requirement_ids: [ REQ-003, REQ-004, REQ-005, REQ-007, REQ-008, REQ-009, REQ-010, REQ-018, REQ-022 ], source_refs: [] }, { item_index: 12, item_key: source:5230488a-1260-4b29-993e-618617fb22f7, verdict: covered, explanation: The original combined specification remains one document with retained future contracts; the later user-directed Resident V1 amendment narrows delivered behavior without deleting the future obligations., requirement_ids: [ REQ-001, REQ-021, REQ-022, REQ-023 ], source_refs: [] }, { item_index: 13, item_key: source:cb35a1e8-060e-42e4-8c28-60ad70a62cfe, verdict: covered, explanation: "Resident, RAM-cache and on-demand semantics remain distinct. Resident is V1; RAM-cache reuse/release and on-demand reclamation are retained as required future work with actual allocation evidence.", requirement_ids: [ REQ-007, REQ-018, REQ-021, REQ-022 ], source_refs: [] }, { item_index: 14, item_key: source:79dc777b-1258-4a80-ae5c-a920d7394dad, verdict: covered, explanation: "V1 fixed startup ID rejects other request models, as narrowed later; REQ-022 retains per-request catalog selection and correct switching for future work.", requirement_ids: [ REQ-004, REQ-006, REQ-012, REQ-022 ], source_refs: [] }, { item_index: 15, item_key: source:cca9871d-4ecd-4e6b-820b-8c3944e5c247, verdict: covered, explanation: "One managed resident model and one active FIFO GPU operation are required in V1; future model transitions retain serialized, safe previous-weight release and in-flight protection.", requirement_ids: [ REQ-006, REQ-011, REQ-022 ], source_refs: [] }, { item_index: 16, item_key: source:8832037d-89fa-48ee-8040-4e070c6a330f, verdict: covered, explanation: "Both configured HTTPS provisioning/cache and read-only prepared-file/offline operation are explicit, with integrity, repeated use, image independence, mounts and persistence across recovery.", requirement_ids: [ REQ-004, REQ-005, REQ-015, REQ-016, REQ-017 ], source_refs: [] }, { item_index: 17, item_key: source:d269e73c-cea0-483c-9a83-0bf783e010be, verdict: covered, explanation: Per-model policy and warmup defaults survive as required future contracts; V1 Resident configuration rejects unavailable overrides rather than silently ignoring them., requirement_ids: [ REQ-003, REQ-008, REQ-021, REQ-022 ], source_refs: [] }, { item_index: 18, item_key: source:46a5c10d-ab18-46b4-a84a-ee8d157bbce1, verdict: covered, explanation: The two HTTP lifecycle operations and their completed/idempotent/no-mutation behavior are explicitly retained for future development; V1 returns 404 without backend change., requirement_ids: [ REQ-009, REQ-010, REQ-021, REQ-022 ], source_refs: [] }, { item_index: 19, item_key: source:d9791931-ae19-42e3-a0d1-6b09aa7d97f6, verdict: covered, explanation: An internal public API Service with optional existing-controller TLS Ingress is required; backend endpoints remain private and TLS is not presented as authentication., requirement_ids: [ REQ-013, REQ-016, REQ-019 ], source_refs: [] }, { item_index: 20, item_key: source:e6008465-f7cd-4af1-8eb8-6723605f5eae, verdict: covered, explanation: "V1 permits unauthenticated API access and excludes built-in/external required auth; future authorization/access administration, proposed admin interface and Prometheus metrics remain explicit with their original certainty.", requirement_ids: [ REQ-016, REQ-019, REQ-021, REQ-022 ], source_refs: [] }, { item_index: 21, item_key: source:001c0763-ff41-47d6-ae3c-9b0fe209d7ad, verdict: covered, explanation: REQ-022 retains only the last model's reusable host weights for future RAM cache; no multi-model cache is