3b8-de9a-4250-948c-a57448b9d10b, revision: 2 }, { id: bf8b57ea-5324-441f-89d5-1576508052be, revision: 3 } ] }, { item_index: 46, item_key: requirement:REQ-007, verdict: covered, explanation: "The explicit resident amendment and unchanged-server boundary justify reusable model/native context. The documented correction preserves API-owned cleanup, bounded retention and isolation without inventing user consent to immediate native zeroization.", requirement_ids: [], source_refs: [ { id: af844c8a-a98c-4536-a079-9c3850131ac0, revision: 4 }, { id: cb35a1e8-060e-42e4-8c28-60ad70a62cfe, revision: 4 }, { id: d269e73c-cea0-483c-9a83-0bf783e010be, revision: 4 }, { id: 001c0763-ff41-47d6-ae3c-9b0fe209d7ad, revision: 4 }, { id: 937f6424-570a-473f-a7e2-ceaa13487116, revision: 4 }, { id: 0ca3a1ee-0c6f-4d33-a2a5-678d76f8b0b6, revision: 4 }, { id: e3f2179a-225b-4c41-87a1-d7cd4b89c593, revision: 4 }, { id: e045c602-8bab-498f-91bd-3622a53663e9, revision: 3 }, { id: 4912a7e6-b29b-425f-92db-0e3e455524d3, revision: 5 }, { id: 517443b8-de9a-4250-948c-a57448b9d10b, revision: 2 }, { id: f92f0134-e91a-4975-b5c3-9e35a29d4e34, revision: 2 }, { id: bcdd4fcc-9e20-491e-82d7-9ae2d002c208, revision: 2 } ] }, { item_index: 47, item_key: requirement:REQ-008, verdict: covered, explanation: Startup load follows unchanged upstream and fixed-startup choice. Earlier load-only per-model warmup/default/ordering behavior remains explicitly retained rather than silently deleted., requirement_ids: [], source_refs: [ { id: af844c8a-a98c-4536-a079-9c3850131ac0, revision: 4 }, { id: cb35a1e8-060e-42e4-8c28-60ad70a62cfe, revision: 4 }, { id: d269e73c-cea0-483c-9a83-0bf783e010be, revision: 4 }, { id: 8b29ebc5-a302-4e79-a27b-59879800f089, revision: 4 }, { id: e3f2179a-225b-4c41-87a1-d7cd4b89c593, revision: 4 }, { id: e045c602-8bab-498f-91bd-3622a53663e9, revision: 3 }, { id: 4912a7e6-b29b-425f-92db-0e3e455524d3, revision: 5 }, { id: 517443b8-de9a-4250-948c-a57448b9d10b, revision: 2 }, { id: 9c299212-832f-476d-9022-93e2f10931e4, revision: 3 } ] }, { item_index: 48, item_key: requirement:REQ-009, verdict: covered, explanation: "The requested management API, explicit RAM/VRAM override and load-only decisions justify the retained completion/idempotency/transition contract; the later transcription-health choice makes V1 absence explicit.", requirement_ids: [], source_refs: [ { id: af844c8a-a98c-4536-a079-9c3850131ac0, revision: 4 }, { id: cb35a1e8-060e-42e4-8c28-60ad70a62cfe, revision: 4 }, { id: 46a5c10d-ab18-46b4-a84a-ee8d157bbce1, revision: 4 }, { id: 8b29ebc5-a302-4e79-a27b-59879800f089, revision: 4 }, { id: 937f6424-570a-473f-a7e2-ceaa13487116, revision: 4 }, { id: e045c602-8bab-498f-91bd-3622a53663e9, revision: 3 }, { id: 4912a7e6-b29b-425f-92db-0e3e455524d3, revision: 5 }, { id: 517443b8-de9a-4250-948c-a57448b9d10b, revision: 2 }, { id: 9c299212-832f-476d-9022-93e2f10931e4, revision: 3 } ] }, { item_index: 49, item_key: requirement:REQ-010, verdict: covered, explanation: "The requested HTTP unload and original model reclamation contract justify serialized completed release, repeated-call safety and disk/policy preservation; its V1 absence follows the later API scope choice.", requirement_ids: [], source_refs: [ { id: af844c8a-a98c-4536-a079-9c3850131ac0, revision: 4 }, { id: cb35a1e8-060e-42e4-8c28-60ad70a62cfe, revision: 4 }, { id: 46a5c10d-ab18-46b4-a84a-ee8d157bbce1, revision: 4 }, { id: 937f6424-570a-473f-a7e2-ceaa13487116, revision: 4 }, { id: e045c602-8bab-498f-91bd-3622a53663e9, revision: 3 }, { id: 4912a7e6-b29b-425f-92db-0e3e455524d3, revision: 5 }, { id: 517443b8-de9a-4250-948c-a57448b9d10b, revision: 2 }, { id: 9c299212-832f-476d-9022-93e2f10931e4, revision: 3 } ] }, { item_index: 50, item_key: requirement:REQ-011, verdict: covered, explanation: "Single active work with a queue and configured deadline assumptions justify FIFO/capacity, waiting no-mutation and safe cancellation. Uncertain native execution cannot overlap the next request.", requirement_ids: [], source_refs: [ { id: cca9871d-4ecd-4e6b-820b-8c3944e5c247, revision: 4 }, { id: 1faa0f88-4142-4d63-8e04-0399a762aa13, revision: 2 }, { id: 4912a7e6-b29b-425f-92db-0e3e455524d3, revision: 5 } ] }, { item_index: 51, item_key: requirement:REQ-012, verdict: covered, explanation: The selected OpenAI-compatible synchronous subset and recorded public conventions justify fields/formats/bounds. The later startup-model choice preserves request validation without unauthorized model switching., requirement_ids: [], source_refs: [ { id: 137b4edb-c35e-41b2-9e01-1303aa63a110, revision: 3 }, { id: e187f63b-53e7-4b0e-adb2-519fef009a5d, revision: 3 }, { id: 79dc777b-1258-4a80-ae5c-a920d7394dad, revision: 4 }, { id: 1faa0f88-4142-4d63-8e04-0399a762aa13, revision: 2 }, { id: 4912a7e6-b29b-425f-92db-0e3e455524d3, revision: 5 }, { id: c7a90a22-a5c0-4a7c-ab6f-2ca23802fc96, revision: 2 }, { id: 9c299212-832f-476d-9022-93e2f10931e4, revision: 3 }, { id: bf8b57ea-5324-441f-89d5-1576508052be, revision: 3 } ] }, { item_index: 52, item_key: requirement:REQ-013, verdict: covered, explanation: "The client subset, separate API/private backend and conventional error mapping justify adaptation, declared absent routes and response isolation. No upstream failure may be relabeled as successful transcription.", requirement_ids: [], source_refs: [ { id: 137b4edb-c35e-41b2-9e01-1303aa63a110, revision: 3 }, { id: e187f63b-53e7-4b0e-adb2-519fef009a5d, revision: 3 }, { id: d9791931-ae19-42e3-a0d1-6b09aa7d97f6, revision: 4 }, { id: 4912a7e6-b29b-425f-92db-0e3e455524d3, revision: 5 }, { id: c7a90a22-a5c0-4a7c-ab6f-2ca23802fc96, revision: 2 }, { id: 9c299212-832f-476d-9022-93e2f10931e4, revision: 3 } ] }, { item_index: 53, item_key: requirement:REQ-014, verdict: covered, explanation: "The selected health-only addition and recorded endpoint conventions justify observable readiness/liveness, actual model/backend dependency and probes that do not load/infer.", requirement_ids: [], source_refs: [ { id: e045c602-8bab-498f-91bd-3622a53663e9, revision: 3 }, { id: 4912a7e6-b29b-425f-92db-0e3e455524d3, revision: 5 }, { id: 9c299212-832f-476d-9022-93e2f10931e4, revision: 3 } ] }, { item_index: 54, item_key: requirement:REQ-015, verdict: covered, explanation: "The packaging goal, unchanged separate backend/API, amd64 and both file-source choices justify two pinned images, GPU-free build, non-root confined writes and standalone CUDA acceptance.", requirement_ids: [], source_refs: [ { id: bb071790-6490-4706-99c2-502fd1467ae7, revision: 2 }, { id: c441aa83-7b3f-4a11-a693-682a9aa41e5a, revision: 4 }, { id: 1b0c4947-2eae-498f-9a29-109b617654ed, revision: 2 }, { id: 8a9ad115-c042-4681-b376-46ba5c398219, revision: 3 }, { id: 8832037d-89fa-48ee-8040-4e070c6a330f, revision: 3 }, { id: e3f2179a-225b-4c41-87a1-d7cd4b89c593, revision: 4 }, { id: 4912a7e6-b29b-425f-92db-0e3e455524d3, revision: 5 }, { id: c7a90a22-a5c0-4a7c-ab6f-2ca23802fc96, revision: 2 }, { id: 517443b8-de9a-4250-948c-a57448b9d10b, revision: 2 }, { id: c6d342d9-11c3-4b25-912b-d92762785da5, revision: 3 }, { id: 36576abe-603a-451d-8a2c-e5a1f9e92215, revision: 2 } ] }, { item_index: 55, item_key: requirement:REQ-016, verdict: covered, explanation: "The original working Helm goal and selected external-cluster/network/model choices justify deployment configuration, backend-only GPU allocation, bounded probes/termination and both-render/actual-cluster verification.", requirement_ids: [], source_refs: [ { id: bb071790-6490-4706-99c2-502fd1467ae7, revision: 2 }, { id: c441aa83-7b3f-4a11-a693-682a9aa41e5a, revision: 4 }, { id: 3ee8e2bc-0cdf-4761-845a-870d431a3f8f, revision: 3 }, { id: 8832037d-89fa-48ee-8040-4e070c6a330f, revision: 3 }, { id: d9791931-ae19-42e3-a0d1-6b09aa7d97f6, revision: 4 }, { id: e6008465-f7cd-4af1-8eb8-6723605f5eae, revision: 5 }, { id: e9638bb0-e355-4535-92de-71b03f99c669, revision: 3 }, { id: 4912a7e6-b29b-425f-92db-0e3e455524d3, revision: 5 }, { id: c7a90a22-a5c0-4a7c-ab6f-2ca23802fc96, revision: 2 }, { id: 517443b8-de9a-4250-948c-a57448b9d10b, revision: 2 }, { id: c6d342d9-11c3-4b25-912b-d92762785da5, revision: 3 } ] }, { item_index: 56, item_key: requirement:REQ-017, verdict: covered, explanation: "Existing-file/cache ownership and bounded operating assumptions, with active operations scope, justify shutdown/rollout/recovery and storage safeguards. Single-GPU replacement has an explicit downtime path rather than requiring an unavailable surge GPU.", requirement_ids: [], source_refs: [ { id: 8832037d-89fa-48ee-8040-4e070c6a330f, revision: 3 }, { id: 1faa0f88-4142-4d63-8e04-0399a762aa13, revision: 2 } ] }, { item_index: 57, item_key: requirement:REQ-018, verdict: covered, explanation: "The original model residency/reclamation conditions, resident V1 amendment and documented native-state correction justify stable reuse and bounded cleanup evidence. Stronger future transition release proof is retained separately.", requirement_ids: [], source_refs: [ { id: af844c8a-a98c-4536-a079-9c3850131ac0, revision: 4 }, { id: cb35a1e8-060e-42e4-8c28-60ad70a62cfe, revision: 4 }, { id: 001c0763-ff41-47d6-ae3c-9b0fe209d7ad, revision: 4 }, { id: 1faa0f88-4142-4d63-8e04-0399a762aa13, revision: 2 }, { id: 4912a7e6-b29b-425f-92db-0e3e455524d3, revision: 5 }, { id: 517443b8-de9a-4250-948c-a57448b9d10b, revision: 2 }, { id: c6d342d9-11c3-4b25-912b-d92762785da5, revision: 3 }, { id: f92f0134-e91a-4975-b5c3-9e35a29d4e34, revision: 2 }, { id: bcdd4fcc-9e20-491e-82d7-9ae2d002c208, revision: 2 } ] }, { item_index: 58, item_key: requirement:REQ-019, verdict: covered, explanation: "The explicit authorization deferral is faithfully distinguished from input/private-backend/least-privilege safeguards. The native-state correction preserves no persistence/logging, API-owned terminal cleanup and isolated bounded retention.", requirement_ids: [], source_refs: [ { id: d9791931-ae19-42e3-a0d1-6b09aa7d97f6, revision: 4 }, { id: e6008465-f7cd-4af1-8eb8-6723605f5eae, revision: 5 }, { id: e045c602-8bab-498f-91bd-3622a53663e9, revision: 3 }, { id: f92f0134-e91a-4975-b5c3-9e35a29d4e34, revision: 2 }, { id: bcdd4fcc-9e20-491e-82d7-9ae2d002c208, revision: 2 } ] }, { item_index: 59, item_key: requirement:REQ-020, verdict: covered, explanation: The explicit dual-environment answer and recorded source/toolchain observations justify mandatory local Docker and Home Lab Helm CUDA proofs. Measurements are required while an unselected numeric performance limit is not invented., requirement_ids: [], source_refs: [ { id: 1b0c4947-2eae-498f-9a29-109b617654ed, revision: 2 }, { id: 8a9ad115-c042-4681-b376-46ba5c398219, revision: 3 }, { id: e9638bb0-e355-4535-92de-71b03f99c669, revision: 3 }, { id: 89323313-ecc7-46ea-9047-1d23df5cf6bc, revision: 2 }, { id: 4912a7e6-b29b-425f-92db-0e3e455524d3, revision: 5 }, { id: 517443b8-de9a-4250-948c-a57448b9d10b, revision: 2 }, { id: c6d342d9-11c3-4b25-912b-d92762785da5, revision: 3 }, { id: 36576abe-603a-451d-8a2c-e5a1f9e92215, revision: 2 } ] }, { item_index: 60, item_key: requirement:REQ-021, verdict: covered, explanation: "The later explicit resident-only, fixed-startup and transcription/health amendments justify V1 exclusions without cancelling earlier lifecycle work. Authorization/UI/metrics and inference/infrastructure work remain outside this release as selected.", requirement_ids: [], source_refs: [ { id: e187f63b-53e7-4b0e-adb2-519fef009a5d, revision: 3 }, { id: 5230488a-1260-4b29-993e-618617fb22f7, revision: 4 }, { id: cb35a1e8-060e-42e4-8c28-60ad70a62cfe, revision: 4 }, { id: d269e73c-cea0-483c-9a83-0bf783e010be, revision: 4 }, { id: 46a5c10d-ab18-46b4-a84a-ee8d157bbce1, revision: 4 }, { id: e6008465-f7cd-4af1-8eb8-6723605f5eae, revision: 5 }, { id: 4912a7e6-b29b-425f-92db-0e3e455524d3, revision: 5 }, { id: c7a90a22-a5c0-4a7c-ab6f-2ca23802fc96, revision: 2 }, { id: 517443b8-de9a-4250-948c-a57448b9d10b, revision: 2 }, { id: 9c299212-832f-476d-9022-93e2f10931e4, revision: 3 }, { id: bf8b57ea-5324-441f-89d5-1576508052be, revision: 3 } ] }, { item_index: 61, item_key: requirement:REQ-022, verdict: covered, explanation: "The original compound lifecycle request and subsequent deferrals are preserved in a required future section, including three modes, per-request/per-model policy, one-model FIFO safety, load-only warmup, completed unload, strong release evidence and expected fork investigation. Access/admin certainty and metrics follow the explicit user answer.", requirement_ids: [], source_refs: [ { id: af844c8a-a98c-4536-a079-9c3850131ac0, revision: 4 }, { id: 5230488a-1260-4b29-993e-618617fb22f7, revision: 4 }, { id: cb35a1e8-060e-42e4-8c28-60ad70a62cfe, revision: 4 }, { id: 79dc777b-1258-4a80-ae5c-a920d7394dad, revision: 4 }, { id: cca9871d-4ecd-4e6b-820b-8c3944e5c247, revision: 4 }, { id: d269e73c-cea0-483c-9a83-0bf783e010be, revision: 4 }, { id: 46a5c10d-ab18-46b4-a84a-ee8d157bbce1, revision: 4 }, { id: e6008465-f7cd-4af1-8eb8-6723605f5eae, revision: 5 }, { id: 001c0763-ff41-47d6-ae3c-9b0fe209d7ad, revision: 4 }, { id: 8b29ebc5-a302-4e79-a27b-59879800f089, revision: 4 }, { id: 937f6424-570a-473f-a7e2-ceaa13487116, revision: 4 }, { id: 0ca3a1ee-0c6f-4d33-a2a5-678d76f8b0b6, revision: 4 }, { id: e045c602-8bab-498f-91bd-3622a53663e9, revision: 3 }, { id: 4912a7e6-b29b-425f-92db-0e3e455524d3, revision: 5 }, { id: c7a90a22-a5c0-4a7c-ab6f-2ca23802fc96, revision: 2 }, { id: 517443b8-de9a-4250-948c-a57448b9d10b, revision: 2 }, { id: 9c299212-832f-476d-9022-93e2f10931e4, revision: 3 }, { id: bf8b57ea-5324-441f-89d5-1576508052be, revision: 3 } ] }, { item_index: 62, item_key: requirement:REQ-023, verdict: covered, explanation: "The confirmed combined Deep scope declares exactly core/contracts.yaml, contracts/openapi.yaml and quality/scenarios.yaml. This requirement preserves behavioral coverage and author/planning ownership without creating artifacts or authorizing implementation.", requirement_ids: [], source_refs: [ { id: 5230488a-1260-4b29-993e-618617fb22f7, revision: 4 } ] }, { item_index: 63, item_key: profile:core, verdict: covered, explanation: "Core is material because Docker configuration and Helm values are two consumers of model/deployment contracts. Observable validation, precedence, replacement/defaults, restart-only reload, unsupported settings, cache/repeat/failure behavior, Linux amd64, script diagnostics and upgrade/rollback are specified. There is no new interactive CLI or plugin ecosystem requiring unrelated commands; planning owns the declared configuration artifact.", requirement_ids: [ REQ-001, REQ-002, REQ-003, REQ-004, REQ-005, REQ-006, REQ-015, REQ-016, REQ-017, REQ-023 ], source_refs: [] }, { item_index: 64, item_key: profile:backend, verdict: covered, explanation: "Backend is material at the new public synchronous API and private unchanged inference boundary. Input/type/format/model validation, success/error status contracts, queue/admission/deadline/cancellation, repeated-call isolation, absence of V1 auth, probes and failure recovery are observable. Warmup/unload and per-request selection remain exact future contracts rather than unimplemented V1 promises. Pagination or multi-provider evolution are irrelevant to this bounded API.", requirement_ids: [ REQ-006, REQ-007, REQ-008, REQ-009, REQ-010, REQ-011, REQ-012, REQ-013, REQ-014, REQ-019, REQ-021, REQ-022, REQ-023 ], source_refs: [] }, { item_index: 65, item_key: profile:operations, verdict: covered, explanation: "Operations is material for single-GPU resident state and two required deployment environments. Capacity/deadlines, no healthy per-request reload, real CUDA/memory/file-I/O evidence, queue/failure/redacted diagnostics, readiness/shutdown/restart and single-GPU rollout/rollback/storage retention are specified. Reprovisionable model cache and protected operator files have recovery paths; no business backup system is in scope. Numeric SLO and Prometheus exposition are explicitly unselected/deferred, while performance measurements remain mandatory.", requirement_ids: [ REQ-002, REQ-003, REQ-005, REQ-007, REQ-011, REQ-014, REQ-015, REQ-016, REQ-017, REQ-018, REQ-020, REQ-021, REQ-023 ], source_refs: [] }, { item_index: 66, item_key: profile:security, verdict: covered, explanation: "Security is material for untrusted audio and configured model files. Public callers and private backend/operator source boundaries, explicitly deferred authentication, non-root confined writes, fixed model/path/filename validation, bounded uploads/decoding, pinned HTTPS/checksum downloads, protected prepared files, credentials/redaction, no durable content/logs and terminal transient cleanup have observable tests. Permitted native context is bounded and isolated, not an invented zeroization promise. Role changes/replay/token issuance do not apply to the unauthenticated V1; they are retained future work.", requirement_ids: [ REQ-003, REQ-004, REQ-005, REQ-011, REQ-012, REQ-013, REQ-015, REQ-016, REQ-018, REQ-019, REQ-021, REQ-022 ], source_refs: [] }, { item_index: 67, item_key: context:specification, verdict: conflict, explanation: "The complete V1/future scope, resident-state permission, privacy limits, public routes and failure ordering agree with the detailed requirements and 67 saved outcomes. One material cross-section conflict remains: Evidence and terminology (spec.md line 23) defines a service instance as one running container and places both its model state and queue in that instance. REQ-001/REQ-015/REQ-016 require separately packaged public API and inference backend, while REQ-011 places the queue in the API and REQ-006/REQ-007 place the resident model in its associated inference backend. The single-container definition is therefore incompatible with the required separated components and leaves the unit for per-instance queue/GPU capacity and replica ownership contradictory. Define the logical API/backend inference unit separately from an individual component container without choosing the deployment topology reserved to planning.", counterexample: "Deploy one public API container with its local FIFO queue and one private unchanged Whisper container holding the fixed GPU-resident model, connected by HTTP, in standalone Docker and the chart. This satisfies the separated-image/HTTP requirements and one-model/one-operation behavior. It cannot satisfy line 23's simultaneous claims that a service instance is one container and that both model state and queue are local to that same instance: neither component container owns both. Treating the pair as the instance instead violates the explicit one-container definition.", requirement_ids: [], source_refs: [] } ]
      consistency_required: true
      input_snapshot: b6d9592ce39168dc527a44eed804bb4e44be38d49741dac7ce65a2b886c61f8e
      consistency:
        verdict: conflict
        explanation: "The complete V1/future scope, resident-state permission, privacy limits, public routes and failure ordering agree with the detailed requirements and 67 saved outcomes. One material cross-section conflict remains: Evidence and terminology (spec.md line 23) defines a service instance as one running container and places both its model state and queue in that instance. REQ-001/REQ-015/REQ-016 require separately packaged public API and inference backend, while REQ-011 places the queue in the API and REQ-006/REQ-007 place the resident model in its associated inference backend. The single-container definition is therefore incompatible with the required separated components and leaves the unit for per-instance queue/GPU capacity and replica ownership contradictory. Define the logical API/backend inference unit separately from an individual component container without choosing the deployment topology reserved to planning."
        counterexample: "Deploy one public API container with its local FIFO queue and one private unchanged Whisper container holding the fixed GPU-resident model, connected by HTTP, in standalone Docker and the chart. This satisfies the separated-image/HTTP requirements and one-model/one-operation behavior. It cannot satisfy line 23's simultaneous claims that a service instance is one container and that both model state and queue are local to that same instance: neither component container owns both. Treating the pair as the instance instead violates the explicit one-container definition."
