  - category: v1-resident-request-state-contract
    state: assumed
    provenance: agent
    assumption: For the already selected unchanged-server Resident V1, distinguish API-owned request resources and transient files from the upstream reusable inference context. API-owned resources are released on terminal paths, while bounded native backend working buffers and its latest internal transcription result may remain until reuse or backend/process stop. V1 promises isolated responses, no accumulating request/model copies, no application audio/transcript persistence or content logging, resident model reuse, and allocation release on backend stop; it does not require immediate erasure/zeroization of all backend RAM/VRAM after each successful request or a normal per-request restart. Deferred model-memory-mode reclamation promises remain unchanged.
    rationale: The user selected a fast working Resident V1 using the unchanged upstream HTTP server and deferred the other memory modes and any fork. Original requests concern model weights residency/reclamation, not secure erasure of individual transcription results. Requiring immediate erasure of native output/decoder buffers was an author-added stronger constraint that conflicts with that selected base. The clarification replies request an explanation and are not recorded as consent to either offered policy. This correction restores that existing scope; its fidelity must be independently reviewed.
    reconsider_when: An explicit user requirement for immediate internal data erasure, unacceptable cross-request influence, unbounded native memory growth, content logging/persistence, or a different upstream lifecycle is established.
    question: null
    answer: null
    id: bcdd4fcc-9e20-491e-82d7-9ae2d002c208
