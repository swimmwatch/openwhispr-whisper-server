rce remain assumptions, not fixed supported model restriction or quality promise; Resident startup and deferred warmup defaults track the user amendment.", requirement_ids: [ REQ-003, REQ-004, REQ-006, REQ-007, REQ-008, REQ-015 ], source_refs: [] }, { item_index: 28, item_key: source:e045c602-8bab-498f-91bd-3622a53663e9, verdict: covered, explanation: "The unchanged native startup/load boundary is reflected; unload/auth absence is explicit, public access is mediated, and future memory integration requires investigation and allocation evidence rather than claiming proxy/source proof.", requirement_ids: [ REQ-001, REQ-006, REQ-007, REQ-008, REQ-009, REQ-010, REQ-014, REQ-019, REQ-022 ], source_refs: [] }, { item_index: 29, item_key: source:89323313-ecc7-46ea-9047-1d23df5cf6bc, verdict: covered, explanation: "The recorded reference minor matrix is retained as initial compatibility targets, with exact release patches and actual chart/GPU qualification separate from documentary compatibility.", requirement_ids: [ REQ-002, REQ-020 ], source_refs: [] }, { item_index: 30, item_key: source:4912a7e6-b29b-425f-92db-0e3e455524d3, verdict: covered, explanation: "The public transcription/health contract, fixed model validation, audio families, stream=false, prompt bound, private unchanged HTTP backend, retained lifecycle deferrals and measured two-environment performance all survive; implementation choices are narrowed only by later explicit Go/Echo and paired-Pod answers.", requirement_ids: [ REQ-003, REQ-006, REQ-007, REQ-008, REQ-009, REQ-010, REQ-011, REQ-012, REQ-013, REQ-014, REQ-015, REQ-016, REQ-018, REQ-020, REQ-021, REQ-022 ], source_refs: [] }, { item_index: 31, item_key: source:c7a90a22-a5c0-4a7c-ab6f-2ca23802fc96, verdict: covered, explanation: "Two separate executable images and a public API calling unchanged native HTTP server are required; V1 source/inference changes and direct library embedding are excluded, while future fork investigation remains conditional.", requirement_ids: [ REQ-001, REQ-012, REQ-013, REQ-015, REQ-016, REQ-021, REQ-022 ], source_refs: [] }, { item_index: 32, item_key: source:517443b8-de9a-4250-948c-a57448b9d10b, verdict: covered, explanation: "Resident V1 delivers real chart transcription with model reuse, bounded cleanup/isolation and measured performance; RAM-cache/on-demand and likely native extension/fork investigation remain required future development rather than cancelled.", requirement_ids: [ REQ-001, REQ-007, REQ-008, REQ-009, REQ-010, REQ-015, REQ-016, REQ-018, REQ-020, REQ-021, REQ-022 ], source_refs: [] }, { item_index: 33, item_key: source:9c299212-832f-476d-9022-93e2f10931e4, verdict: covered, explanation: Only public transcription and health exist in V1. Management routes and warmup controls are absent/rejected but future contracts are retained., requirement_ids: [ REQ-008, REQ-009, REQ-010, REQ-012, REQ-013, REQ-014, REQ-021, REQ-022 ], source_refs: [] }, { item_index: 34, item_key: source:bf8b57ea-5324-441f-89d5-1576508052be, verdict: covered, explanation: The exact startup-fixed single-model selection and rejection of other IDs preserve the later V1 simplification; future selection remains separated., requirement_ids: [ REQ-003, REQ-004, REQ-006, REQ-008, REQ-012, REQ-022 ], source_refs: [] }, { item_index: 35, item_key: source:c6d342d9-11c3-4b25-912b-d92762785da5, verdict: covered, explanation: Both named GPU environments remain mandatory release acceptance; compile/enumeration and unavailable target do not substitute for actual CUDA transcription and lifecycle evidence., requirement_ids: [ REQ-002, REQ-015, REQ-016, REQ-018, REQ-020 ], source_refs: [] }, { item_index: 36, item_key: source:36576abe-603a-451d-8a2c-e5a1f9e92215, verdict: covered, explanation: "REQ-002/015/020 use the verified RTX 5070 Ti Laptop identity for mandatory local Docker acceptance, explicitly distinguishing read-only GPU identity from runtime CUDA verification.", requirement_ids: [ REQ-002, REQ-015, REQ-020 