d sources/profile checks and final consistency assessment.", requirement_ids: [], source_refs: [ { id: scope.manifest, revision: 9 } ] }, { item_index: 5, item_key: source:3ee8e2bc-0cdf-4761-845a-870d431a3f8f, verdict: covered, explanation: REQ-002 declares drivers/container integration/device plugin and optional controller/storage as external prerequisites; REQ-016 deploys the service and provides actual Helm verification without provisioning the cluster., requirement_ids: [ REQ-002, REQ-016 ], source_refs: [ { id: 3ee8e2bc-0cdf-4761-845a-870d431a3f8f, revision: 3 } ] }, { item_index: 6, item_key: source:137b4edb-c35e-41b2-9e01-1303aa63a110, verdict: covered, explanation: REQ-012 defines OpenAI-compatible synchronous multipart transcription and advertised audio families; REQ-013 defines compatible response/error envelopes and restricts the public subset with private upstream HTTP., requirement_ids: [ REQ-012, REQ-013 ], source_refs: [ { id: 137b4edb-c35e-41b2-9e01-1303aa63a110, revision: 3 } ] }, { item_index: 7, item_key: source:6ab79cf6-6804-4d66-8b2a-dcbcf30cf8c7, verdict: covered, explanation: "REQ-002 explicitly preserves the pinned upstream CUDA backend architecture coverage rather than narrowing to the offered family presets, and records toolchain/driver mapping and actual named GPU tests.", requirement_ids: [ REQ-002 ], source_refs: [ { id: 6ab79cf6-6804-4d66-8b2a-dcbcf30cf8c7, revision: 4 } ] }, { item_index: 8, item_key: source:1b0c4947-2eae-498f-9a29-109b617654ed, verdict: covered, explanation: REQ-002 preserves source CUDA architecture coverage and allows compatible toolchain variants with published mappings; REQ-015 pins backend/source/base identities; REQ-020 rejects compilation/enumeration as actual GPU evidence. The observed upstream Dockerfile is not incorrectly adopted as the support boundary., requirement_ids: [ REQ-002, REQ-015, REQ-020 ], source_refs: [ { id: 1b0c4947-2eae-498f-9a29-109b617654ed, revision: 2 } ] }, { item_index: 9, item_key: source:8a9ad115-c042-4681-b376-46ba5c398219, verdict: covered, explanation: "REQ-002 retains the selected source-level CUDA compatibility rather than the narrower current image, with GPU-free builds, variants and driver/architecture mapping; REQ-015/020 require identified actual CUDA qualification.", requirement_ids: [ REQ-002, REQ-015, REQ-020 ], source_refs: [ { id: 8a9ad115-c042-4681-b376-46ba5c398219, revision: 3 } ] }, { item_index: 10, item_key: source:e187f63b-53e7-4b0e-adb2-519fef009a5d, verdict: covered, explanation: "REQ-012/013 provide synchronous POST /v1/audio/transcriptions JSON/text and health only, reject streaming and expose no unrelated OpenAI operations; REQ-021 explicitly retains the selected exclusions.", requirement_ids: [ REQ-012, REQ-013, REQ-021 ], source_refs: [ { id: e187f63b-53e7-4b0e-adb2-519fef009a5d, revision: 3 } ] }, { item_index: 11, item_key: source:af844c8a-a98c-4536-a079-9c3850131ac0, verdict: covered, explanation: "REQ-003/004 expose equivalent Docker/Helm catalog/download/served-model configuration; REQ-005 preserves cache ownership and integrity. Under the subsequently confirmed Resident V1 boundary, REQ-007 retains residency and bounded cleanup; REQ-008/009/010/018/022 explicitly retain the deferred warmup/unload/RAM-cache/on-demand semantics rather than deleting them.", requirement_ids: [ REQ-001, REQ-003, REQ-004, REQ-005, REQ-007, REQ-008, REQ-009, REQ-010, REQ-018, REQ-022 ], source_refs: [ { id: af844c8a-a98c-4536-a079-9c3850131ac0, revision: 4 }, { id: scope.manifest, revision: 9 } ] }, { item_index: 12, item_key: source:5230488a-1260-4b29-993e-618617fb22f7, verdict: covered, explanation: "The original combined-specification choice is preserved: REQ-001/021 retain packaging in V1 and REQ-022 retains all deferred model-management obligations in this same specification. REQ-023 declares the three agreed handoff artifacts; later confirmed Resident V1 scope defers execution rather than splitting away the source contract.", requirement_ids: [ REQ-001, REQ-021, REQ-022, REQ-023 ], source_refs: [ { id: 5230488a-1260-4b29-993e-618617fb22f7, revision: 4 }, { id: scope.manifest, revision: 9 } ] }, { item_index: 13, item_key: source:cb35a1e8-060e-42e4-8c28-60ad70a62cfe, verdict: covered, explanation: "The later confirmed Resident V1 boundary restricts delivered mode to resident in REQ-003/006/007/021 while REQ-022 retains all three requested modes, ram-cache/on-demand cleanup and selection rules; REQ-008/009/010/018 preserve deferred warmup/unload and observable reclamation.", requirement_ids: [ REQ-003, REQ-006, REQ-007, REQ-008, REQ-009, REQ-010, REQ-018, REQ-021, REQ-022 ], source_refs: [ { id: cb35a1e8-060e-42e4-8c28-60ad70a62cfe, revision: 4 }, { id: scope.manifest, revision: 9 } ] }, { item_index: 14, item_key: source:79dc777b-1258-4a80-ae5c-a920d7394dad, verdict: covered, explanation: REQ-003/004/006/012 define the later approved fixed startup ID boundary and reject other IDs without mutation; REQ-022 explicitly preserves original per-request selection from configured served catalog as required future work., requirement_ids: [ REQ-003, REQ-004, REQ-006, REQ-012, REQ-022 ], source_refs: [ { id: 79dc777b-1258-4a80-ae5c-a920d7394dad, revision: 4 }, { id: scope.manifest, revision: 9 } ] }, { item_index: 15, item_key: source:cca9871d-4ecd-4e6b-820b-8c3944e5c247, verdict: covered, explanation: REQ-006/011 retain one model/backend and one active GPU operation with bounded FIFO queue and safe active cancellation; REQ-022 preserves future serialized switching and prevents invalidating in-flight work., requirement_ids: [ REQ-006, REQ-011, REQ-022 ], source_refs: [ { id: cca9871d-4ecd-4e6b-820b-8c3944e5c247, revision: 4 } ] }, { item_index: 16, item_key: source:8832037d-89fa-48ee-8040-4e070c6a330f, verdict: covered, explanation: "REQ-004 permits both release-pinned HTTPS/cache and operator-prepared mounted files, with offline reuse and no unexpected download fallback. REQ-005 protects integrity/ownership; REQ-015/016/017 expose storage and preserve it during restart/rollback/uninstall.", requirement_ids: [ REQ-004, REQ-005, REQ-015, REQ-016, REQ-017 ], source_refs: [ { id: 8832037d-89fa-48ee-8040-4e070c6a330f, revision: 3 } ] }, { item_index: 17, item_key: source:d269e73c-cea0-483c-9a83-0bf783e010be, verdict: covered, explanation: "Under confirmed Resident V1, REQ-003/007/008 reject optional per-model policies in V1; REQ-022 preserves global ram-cache default plus per-model overrides, and REQ-008 retains per-model automatic warmup targets/default/order.", requirement_ids: [ REQ-003, REQ-007, REQ-008, REQ-021, REQ-022 ], source_refs: [ { id: d269e73c-cea0-483c-9a83-0bf783e010be, revision: 4 }, { id: scope.manifest, revision: 9 } ] }, { item_index: 18, item_key: source:46a5c10d-ab18-46b4-a84a-ee8d157bbce1, verdict: covered, explanation: "REQ-009/010 preserve exact future HTTP warmup/unload contracts, serialization/completed replies/no-file-deletion behavior; REQ-021/022 explicitly defer them and require 404 without resident mutation in V1.", requirement_ids: [ REQ-009, REQ-010, REQ-021, REQ-022 ], source_refs: [ { id: 46a5c10d-ab18-46b4-a84a-ee8d157bbce1, revision: 4 }, { id: scope.manifest, revision: 9 } ] }, { item_index: 19, item_key: source:d9791931-ae19-42e3-a0d1-6b09aa7d97f6, verdict: covered, explanation: "REQ-016 provides internal Service by default and optional Ingress with configurable host/class/annotations/TLS references through an existing controller, exposes only API; REQ-013/019 preserve private backend and correctly disclose no built-in authentication.", requirement_ids: [ REQ-013, REQ-016, REQ-019 ], source_refs: [ { id: d9791931-ae19-42e3-a0d1-6b09aa7d97f6, revision: 4 } ] }, { item_index: 20, item_key: source:e6008465-f7cd-4af1-8eb8-6723605f5eae, verdict: covered, explanation: "REQ-019 explicitly removes all V1 API key/accounts/roles/proxy-auth requirements and discloses reachability grants transcription; REQ-016 retains network/TLS boundaries without claiming identity. REQ-021/022 retain future authorization/access administration, possible admin UI and Prometheus with their differing certainty.", requirement_ids: [ REQ-016, REQ-019, REQ-021, REQ-022 ], source_refs: [ { id: e6008465-f7cd-4af1-8eb8-6723605f5eae, revision: 5 } ] }, { item_index: 21, item_key: source:001c0763-ff41-47d6-ae3c-9b0fe209d7ad, verdict: covered, explanation: "REQ-022 explicitly preserves only the last model's reusable RAM weights, one managed model and prior model release before switching; REQ-018 retains future reclamation proof while REQ-006/007 implement the later Resident V1 boundary.", requirement_ids: [ REQ-006, REQ-007, REQ-018, REQ-022 ], source_refs: [ { id: 001c0763-ff41-47d6-ae3c-9b0fe209d7ad, revision: 4 }, { id: scope.manifest, revision: 9 } ] }, { item_index: 22, item_key: source:8b29ebc5-a302-4e79-a27b-59879800f089, verdict: covered, explanation: REQ-008 requires startup model loading without synthetic transcription; REQ-009 and REQ-022 preserve future automatic/manual weights-only warmup and prohibit test inference., requirement_ids: [ REQ-008, REQ-009, REQ-022 ], source_refs: [ { id: 8b29ebc5-a302-4e79-a27b-59879800f089, revision: 4 } ] }, { item_index: 23, item_key: source:937f6424-570a-473f-a7e2-ceaa13487116, verdict: covered, explanation: "REQ-009 preserves explicit RAM/VRAM target and temporary on-demand override until next actual processing, selection, unload or shutdown; validation/waiting timeout do not end it. REQ-010/022 retain completed serialized unload and cleanup transitions; V1 endpoints remain deferred.", requirement_ids: [ REQ-007, REQ-009, REQ-010, REQ-022 ], source_refs: [ { id: 937f6424-570a-473f-a7e2-ceaa13487116, revision: 4 }, { id: scope.manifest, revision: 9 } ] }, { item_index: 24, item_key: source:e9638bb0-e355-4535-92de-71b03f99c669, verdict: covered, explanation: "REQ-002 states generic maintained Kubernetes branches and Helm 3/4 reference minors separately from actual unknown Home Lab version, requires exact patch support evidence; REQ-016/020 require render/schema and actual Home Lab qualification rather than assuming compatibility.", requirement_ids: [ REQ-002, REQ-016, REQ-020 ], source_refs: [ { id: e9638bb0-e355-4535-92de-71b03f99c669, revision: 3 } ] }, { item_index: 25, item_key: source:0ca3a1ee-0c6f-4d33-a2a5-678d76f8b0b6, verdict: covered, explanation: REQ-022 retains original future global ram-cache default with per-model overrides; REQ-003/007 apply resident only in the explicitly subsequently confirmed V1 boundary without silently changing the retained future default., requirement_ids: [ REQ-003, REQ-007, REQ-022 ], source_refs: [ { id: 0ca3a1ee-0c6f-4d33-a2a5-678d76f8b0b6, revision: 4 }, { id: scope.manifest, revision: 9 } ] }, { item_index: 26, item_key: source:1faa0f88-4142-4d63-8e04-0399a762aa13, verdict: covered, explanation: "REQ-003 preserves every stated configurable resource/deadline/download-attempt default and their validation bounds without promising an SLO; REQ-011/012/017/018 apply queue, input, shutdown and cleanup behavior rather than treating them as untested throughput promises.", requirement_ids: [ REQ-003, REQ-011, REQ-012, REQ-017, REQ-018 ], source_refs: [ { id: 1faa0f88-4142-4d63-8e04-0399a762aa13, revision: 2 } ] }, { item_index: 27, item_key: source:e3f2179a-225b-4c41-87a1-d7cd4b89c593, verdict: covered, explanation: REQ-003 preserves reversible multilingual base and explicit catalog replacement; REQ-004/006/007/008 require exactly one configured model loaded at startup without test inference. REQ-015 keeps model identity independent from executable image rebuild; earlier ram-cache/warmup remains deferred explicitly., requirement_ids: [ REQ-003, REQ-004, REQ-006, REQ-007, REQ-008, REQ-015 ], source_refs: [ { id: e3f2179a-225b-4c41-87a1-d7cd4b89c593, revision: 4 } ] }, { item_index: 28, item_key: source:e045c602-8bab-498f-91bd-3622a53663e9, verdict: covered, explanation: REQ-001/006/007 preserve unmodified se