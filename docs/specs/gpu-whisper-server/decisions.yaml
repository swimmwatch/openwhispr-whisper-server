  - category: project_initialization_release
    state: instructed
    provenance: user
    instruction:
      text: Включи, пожалуйста в план инициализацию проекта. Разбей инициализацию на несколько этапов, посмотри в интернете, какие есть рекомендации для настроек проектов, связанных с Docker и Helm. Давай добавим разные регистры и для Docker, и для Helm. Проверь, что нужно, включи GitHub репозиторий как open source проекту, все необходимые Markdown файлы. Также нужно будет подготовить README файл, но это в конце можно сделать, в плане. И также нужно включить в план CI/CD, настройку CI/CD. И нужно в плане отразить, что у нас будет сначала pre-release делаться, на котором мы проверим, что сборка собирается, если нет, то будем фиксить до тех пор, пока вся сборка отработает. И потом будем делать настоящий релиз уже. Также нужно в проекте настроить все агентские инструменты, в частности прописать корректный agents.md файл и настроить скиллы необходимые и прочие настройки.
