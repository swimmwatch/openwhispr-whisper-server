    question:
      text: Как модель Whisper должна попадать в контейнер? Например, при первой установке можно скачать её в постоянный том и использовать повторно после перезапуска.
      kind: single_choice
      options:
        - id: download-cache
          label: Скачивать и сохранять (Recommended)
        - id: existing-volume
          label: Только готовая модель в томе
        - id: baked-in
          label: Включить модель в образ
    answer:
      text: Нам нужно позволить это редактировать параметрами как и докер контейнера, так и Helm chart values. Мы должны уметь указывать, какие модели мы будем загружать и какие модели мы будем использовать на сервере. Также нам нужно уметь работать в разных режимах. Нам нужно уметь прогреваться и очищать память, если мы загружаем веса в оперативную память или видеопамять. Или, допустим, работать в режиме, когда мы используем веса только тогда, когда мы делаем запрос.
      selected_ids: []
    status: answered
