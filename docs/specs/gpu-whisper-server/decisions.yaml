rivate. REQ-016 retains both deployables and REQ-021/022 defer source changes rather than assuming arbitrary native lifecycle extensions are available., requirement_ids: [ REQ-001, REQ-012, REQ-013, REQ-015, REQ-016, REQ-021, REQ-022 ], source_refs: [ { id: c7a90a22-a5c0-4a7c-ab6f-2ca23802fc96, revision: 2 } ] }, { item_index: 32, item_key: source:517443b8-de9a-4250-948c-a57448b9d10b, verdict: covered, explanation: REQ-001/015/016 retain working two-image Helm/standalone transcription outcome; REQ-006/007/008 deliver resident startup reuse. REQ-020 measures repeated real performance without inventing latency SLO; REQ-021/022 explicitly retain required ram-cache/on-demand work and likely upstream fork investigation. REQ-018 keeps current cleanup/stability and future reclamation obligations distinct., requirement_ids: [ REQ-001, REQ-006, REQ-007, REQ-008, REQ-009, REQ-010, REQ-015, REQ-016, REQ-018, REQ-020, REQ-021, REQ-022 ], source_refs: [ { id: 517443b8-de9a-4250-948c-a57448b9d10b, revision: 2 } ] }, { item_index: 33, item_key: source:9c299212-832f-476d-9022-93e2f10931e4, verdict: covered, explanation: "REQ-012/013/014 expose transcription plus live/ready only. REQ-008/009/010/021/022 explicitly defer optional/HTTP lifecycle controls, reject settings and return 404 without resident mutation, while retaining their future contract.", requirement_ids: [ REQ-008, REQ-009, REQ-010, REQ-012, REQ-013, REQ-014, REQ-021, REQ-022 ], source_refs: [ { id: 9c299212-832f-476d-9022-93e2f10931e4, revision: 3 } ] }, { item_index: 34, item_key: source:bf8b57ea-5324-441f-89d5-1576508052be, verdict: covered, explanation: REQ-003/004/006 select exactly one served startup model via Docker/Helm; REQ-012 rejects other request IDs without loading/switching. REQ-021/022 preserve earlier per-request selection only as future work and require restart/controlled replacement in V1., requirement_ids: [ REQ-003, REQ-004, REQ-006, REQ-012, REQ-021, REQ-022 ], source_refs: [ { id: bf8b57ea-5324-441