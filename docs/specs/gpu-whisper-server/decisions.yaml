  - category: public-api-conventions
    state: assumed
    provenance: agent
    assumption: Use synchronous lifecycle extensions POST /v1/models/{model}/warmup (explicit ram/vram target) and POST /v1/models/{model}/unload, with completed-state JSON results. Health paths are /health/live (200 JSON status=live) and /health/ready. Invalid inputs are rejected rather than ignored and validation/queued timeout never changes residency. Model IDs are confined to the configured served catalog. Distinguish model-owned memory from bounded runtime/driver housekeeping. Use a configurable 8 KiB prompt limit. Support the official transcription input file families WAV, MP3, MP4, MPEG, MPGA, M4A, OGG, FLAC, WebM, including browser Opus recordings; keep the agreed synchronous JSON/text response subset.
    rationale: "Conventional public HTTP definitions make the agreed lifecycle testable without choosing implementation technology. The official OpenAI create-transcription reference, inspected on 2026-10-10, lists these nine input formats and the file/model multipart boundary: https://developers.openai.com/api/reference/resources/audio/subresources/transcriptions/methods/create . Configurable prompt bounds are compatible with the existing low-risk operating-default assumption."
