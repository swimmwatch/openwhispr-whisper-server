Q-001, REQ-006, REQ-013, REQ-016, REQ-017 ], source_refs: [] }, { item_index: 42, item_key: source:c5d54f80-6d8c-47b3-948f-052dfe7996c5, verdict: covered, explanation: The user's explicit free-text Echo choice is reflected alongside Go; pins and implementation middleware remain planning-owned., requirement_ids: [ REQ-001, REQ-015 ], source_refs: [] }, { item_index: 43, item_key: source:e6571102-69f5-4784-89eb-7104e32f61ef, verdict: covered, explanation: "Both images go to GHCR/Docker Hub and identical chart archives to GHCR OCI/Pages, with immutable inventory, read-back and release gating.", requirement_ids: [ REQ-027, REQ-028 ], source_refs: [] }, { item_index: 44, item_key: source:42cba409-d04a-45bf-8ed6-2bcbdd20f9f4, verdict: covered, explanation: "CD publishes immutable artifacts/GitHub releases only; both GPU acceptance and Home Lab deployment remain separately authorized manual runs, without automatic cluster credentials/deployment.", requirement_ids: [ REQ-026, REQ-028 ], source_refs: [] }, { item_index: 45, item_key: source:cace67ca-917d-41a4-9998-fcac47b7a937, verdict: covered, explanation: "Both Codex and Claude support are portable, share case-correct authoritative project rules and demonstrate instruction/skill/tool discovery without personal paths or secret/settings changes.", requirement_ids: [ REQ-025 ], source_refs: [] }, { item_index: 46, item_key: source:a9b7afb5-35e8-4373-b668-c0d8c6f9600b, verdict: covered, explanation: REQ-024 applies Apache-2.0 to own code/chart and independently preserves packaged third-party licenses/redistribution notices; it does not relabel upstream components., requirement_ids: [ REQ-024 ], source_refs: [] }, { item_index: 47, item_key: source:868c00ff-72a3-455f-8bea-ab98b4f21f67, verdict: covered, explanation: The answer supplied no concrete namespace; REQ-024/027 use names only from the separately explicit later repository_identity answer and require live ownership/write-access verification during setup., requirement_ids: [ REQ-024, REQ-027 ], source_refs: [] }, { item_index: 48, item_key: source:2693b508-1a1c-44b5-966a-f3998d8fdecc, verdict: covered, explanation: "Exact GitHub swimmwatch/openwhispr-whisper-server, GHCR owner and Docker Hub namespace swimmwatch are preserved, with required identity/permission/public-read verification.", requirement_ids: [ REQ-024, REQ-027 ], source_refs: [] }, { item_index: 49, item_key: source:c9d07dc5-03bd-48ab-9d2f-e0290b05ad86, verdict: covered, explanation: "REQ-024-028 preserve contributor/GitHub/community setup, portable agents/skills, complete CI/CD, multiple image/chart channels, final tested README, prerelease build fixing and stable promotion. Task stages and researched tooling choices properly belong to planning rather than behavioral specification.", requirement_ids: [ REQ-024, REQ-025, REQ-026, REQ-027, REQ-028 ], source_refs: [] }, { item_index: 50, item_key: source:b88a4fd8-5590-4611-9f02-81154450b379, verdict: gap, explanation: "REQ-026 requires dependency/image security plus general Go static, Dockerfile and Helm schema/render checks, but never explicitly requires security analysis of Go source or Docker/Helm configuration. The user specifically requested Security Check for all three code/configuration surfaces. Existing generic validation could pass without those checks.", counterexample: "CI runs gofmt/go vet/tests, vulnerability scans of dependencies/images, Docker build and Helm schema/render checks, with no Go code security analysis or Docker/Helm misconfiguration scan. This satisfies the listed REQ-026 coverage yet omits requested source/configuration Security Checks.", requirement_ids: [ REQ-026, REQ-028 ], source_refs: [] }, { item_index: 51, item_key: source:cd0ee52c-87e7-4ed0-b695-ff75572a660a, verdict: covered, explanation: "REQ-029-031 require structured startup/request logs and safe request-ID propagation, early per-IP admission, clean dependency boundaries and conventional private Go packaging, maintained middleware/configuration/validation packages, strict input/configuration behavior and actual initialization/import/security checks. Research/package installation choices remain planning-owned; no dependency is represented as installed.", requirement_ids: [ REQ-029, REQ-030, REQ-031 ], source_refs: [] }, { item_index: 52, item_key: source:71971b6b-db75-4a9c-87fc-b0a33faba68e, verdict: covered, explanation: "REQ-030 uses per-IP, per-Pod in-memory quotas and a replaceable store boundary, preserves GPU queue/input protections and explicitly defers Redis/distributed semantics. REQ-031 avoids implementing a speculative storage/DI framework.", requirement_ids: [ REQ-030, REQ-031 ], source_refs: [] }, { item_index: 53, item_key: source:37b0f5f9-bcc2-4368-a23e-bea37c9ff752, verdict: covered, explanation: The translated instruction is supported by the exact related user answer and adds no current external store. REQ-030/031 preserve future replaceability while rejecting unsupported V1 backend configuration., requirement_ids: [ REQ-030, REQ-031 ], source_refs: [] }, { item_index: 54, item_key: requirement:REQ-001, verdict: covered, explanation: "The original packaging goal, explicit separate unchanged HTTP wrapper architecture and Resident narrowing justify REQ-001. Later exact Go, Echo and separate-Pod choices support the retained technology/topology without author-invented source patches or inference embedding.", requirement_ids: [], source_refs: [ { id: bb071790-6490-4706-99c2-502fd1467ae7, revision: 2 }, { id: af844c8a-a98c-4536-a079-9c3850131ac0, revision: 4 }, { id: 5230488a-1260-4b29-993e-618617fb22f7, revision: 4 }, { id: e045c602-8bab-498f-91bd-3622a53663e9, revision: 3 }, { id: c7a90a22-a5c0-4a7c-ab6f-2ca23802fc96, revision: 2 }, { id: 517443b8-de9a-4250-948c-a57448b9d10b, revision: 2 }, { id: 1b92f196-e1d9-43fd-b2d1-a9c351c5da8b, revision: 3 }, { id: 3887035f-9022-4e35-90a3-d69842dd97f5, revision: 3 }, { id: c5d54f80-6d8c-47b3-948f-052dfe7996c5, revision: 3 } ] }, { item_index: 55, item_key: requirement:REQ-002, verdict: covered, explanation: "The amd64 answer, upstream-source GPU boundary, existing cluster answer, maintained Kubernetes/Helm selection, two-environment acceptance and verified local GPU identity justify all target/compatibility terms. Documentation/source facts remain distinguished from runtime proof.", requirement_ids: [], source_refs: [ { id: bb071790-6490-4706-99c2-502fd1467ae7, revision: 2 }, { id: c441aa83-7b3f-4a11-a693-682a9aa41e5a, revision: 4 }, { id: 3ee8e2bc-0cdf-4761-845a-870d431a3f8f, revision: 3 }, { id: 6ab79cf6-6804-4d66-8b2a-dcbcf30cf8c7, revision: 4 }, { id: 1b0c4947-2eae-498f-9a29-109b617654ed, revision: 2 }, { id: 8a9ad115-c042-4681-b376-46ba5c398219, revision: 3 }, { id: e9638bb0-e355-4535-92de-71b03f99c669, revision: 3 }, { id: 89323313-ecc7-46ea-9047-1d23df5cf6bc, revision: 2 }, { id: c6d342d9-11c3-4b25-912b-d92762785da5, revision: 3 }, { id: 36576abe-603a-451d-8a2c-e5a1f9e92215, revision: 2 } ] }, { item_index: 56, item_key: requirement:REQ-003, verdict: covered, explanation: "The model provisioning/selection/policy answers plus later fixed Resident amendment justify configuration equivalence, independent catalog/sets and V1 rejections. Numeric limits and base are separately labeled reversible assumptions; unknown/invalid fail-before-serving and precedence provide relevant core trust-boundary behavior.", requirement_ids: [], source_refs: [ { id: af844c8a-a98c-4536-a079-9c3850131ac0, revision: 4 }, { id: cb35a1e8-060e-42e4-8c28-60ad70a62cfe, revision: 4 }, { id: 79dc777b-1258-4a80-ae5c-a920d7394dad, revision: 4 }, { id: d269e73c-cea0-483c-9a83-0bf783e010be, revision: 4 }, { id: 0ca3a1ee-0c6f-4d33-a2a5-678d76f8b0b6, revision: 4 }, { id: 1faa0f88-4142-4d63-8e04-0399a762aa13, revision: 2 }, { id: e3f2179a-225b-4c41-87a1-d7cd4b89c593, revision: 4 }, { id: 4912a7e6-b29b-425f-92db-0e3e455524d3, revision: 5 }, { id: bf8b57ea-5324-441f-89d5-1576508052be, revision: 3 } ] }, { item_index: 57, item_key: requirement:REQ-004, verdict: covered, explanation: "Configured independent download and served sets, both prepared/download sources and fixed startup model are directly sourced. Offline valid-cache reuse and missing prepared-file failure enforce the chosen paths without unrequested fallback.", requirement_ids: [], source_refs: [ { id: af844c8a-a98c-4536-a079-9c3850131ac0, revision: 4 }, { id: 79dc777b-1258-4a80-ae5c-a920d7394dad, revision: 4 }, { id: 8832037d-89fa-48ee-8040-4e070c6a330f, revision: 3 }, { id: e3f2179a-225b-4c41-87a1-d7cd4b89c593, revision: 4 }, { id: bf8b57ea-5324-441f-89d5-1576508052be, revision: 3 } ] }, { item_index: 58, item_key: requirement:REQ-005, verdict: covered, explanation: Artifact integrity/atomic cache ownership and interrupted-output preservation are necessary safe behavior for the confirmed mutable persistent model cache and read-only prepared files; they preserve download/prepared source choices and avoid deleting valid artifacts., requirement_ids: [], source_refs: [ { id: af844c8a-a98c-4536-a079-9c3850131ac0, revision: 4 }, { id: 8832037d-89fa-48ee-8040-4e070c6a330f, revision: 3 } ] }, { item_index: 59, item_key: requirement:REQ-006, verdict: conflict, explanation: "The fixed-model source supports rejection of another model ID, but REQ-006 acceptance instead says 'A different request ID is rejected before inference'. With REQ-029 request correlation now explicit, that rejects or ambiguously constrains valid independent request IDs and contradicts diagnostic-only correlation.", counterexample: "Two valid requests both send model=base and distinct valid X-Request-ID values trace-1 and trace-2. REQ-029 permits/preserves both IDs without affecting behavior, while literal REQ-006 acceptance demands rejection of the different request ID before inference. The intended rejection must concern a different model ID.", requirement_ids: [ REQ-006, REQ-029 ], source_refs: [ { id: cb35a1e8-060e-42e4-8c28-60ad70a62cfe, revision: 4 }, { id: 79dc777b-1258-4a80-ae5c-a920d7394dad, revision: 4 }, { id: cca9871d-4ecd-4e6b-820b-8c3944e5c247, revision: 4 }, { id: 001c0763-ff41-47d6-ae3c-9b0fe209d7ad, revision: 4 }, { id: e3f2179a-225b-4c41-87a1-d7cd4b89c593, revision: 4 }, { id: e045c602-8bab-498f-91bd-3622a53663e9, revision: 3 }, { id: 4912a7e6-b29b-425f-92db-0e3e455524d3, revision: 5 }, { id: 517443b8-de9a-4250-948c-a57448b9d10b, revision: 2 }, { id: bf8b57ea-5324-441f-89d5-1576508052be, revision: 3 }, { id: 3887035f-9022-4e35-90a3-d69842dd97f5, revision: 3 }, { id: cd0ee52c-87e7-4ed0-b695-ff75572a660a, revision: 2 } ] }, { item_index: 60, item_key: requirement:REQ-007, verdict: covered, explanation: "Resident narrowing and unchanged native evidence/correction justify retained model/context state, API/file cleanup, terminal release and safe recovery. Future modes remain deferred, with boundedness/isolation rather than unsupported immediate secure erasure or healthy per-request restarts.", requirement_ids: [], source_refs: [ { id: af844c8a-a98c-4536-a079-9c3850131ac0, revision: 4 }, { id: cb35a1e8-060e-42e4-8c28-60ad70a62cfe, revision: 4 }, { id: d269e73c-cea0-483c-9a83-0bf783e010be, revision: 4 }, { id: 001c0763-ff41-47d6-ae3c-9b0fe209d7ad, revision: 4 }, { id: 937f6424-570a-473f-a7e2-ceaa13487116, revision: 4 }, { id: 0ca3a1ee-0c6f-4d33-a2a5-678d76f8b0b6, revision: 4 }, { id: e3f2179a-225b-4c41-87a1-d7cd4b89c593, revision: 4 }, { id: e045c602-8bab-498f-91bd-3622a53663e9, revision: 3 }, { id: 4912a7e6-b29b-425f-92db-0e3e455524d3, revision: 5 }, { id: 517443b8-de9a-4250-948c-a57448b9d10b, revision: 2 }, { id: f92f0134-e91a-4975-b5c3-9e35a29d4e34, revision: 2 }, { id: bcdd4fcc-9e20-491e-82d7-9ae2d002c208, revision: 2 } ] }, { item_index: 61, item_key: requirement:REQ-008, verdict: covered, explanation: "The original per-model/load-only warmup choices and native startup evidence justify fixed V1 load before readiness without synthetic inference. Future RAM/VRAM, disabled-default, catalog-order and failed-warmup rules remain expressly deferred by the later transcript/health scope.", requirement_ids: [], source_refs: [ { id: af844c8a-a98c-4536-a079-9c3850131ac0, revision: 4 }, { id: cb35a1e8-060e-42e4-8c28-60ad70a62cfe, revision: 4 }, { id: d269e73c-cea0-483c-9a83-0bf783e010be, revision: 4 }, { id: 8b29ebc5-a302-4e79-a27b-59879800f089, revision: 4 }, { id: e3f2179a-225b-4c41-87a1-d7cd4b89c593, revision: 4 }, { id: e045c602-8bab-498f-91bd-3622a53663e9, revision: 3 }, { id: 4912a7e6-b29b-425f-92db-0e3e455524d3, revision: 5 }, { id: 517443b8-de9a-4250-948c-a57448b9d10b, revision: 2 }, { id: 9c299212-832f-476d-9022-93e2f10931e4, revision: 3 } ] }, { item_index: 62, item_key: requirement:REQ-009, verdict: covered, explanation: "Explicit lifecycle HTTP and target-selection answers justify future RAM/VRAM weights-only completed/idempotent replies and retained temporary override transitions. V1 absence is supported by explicit management deferral, not an unsupported deletion.", requirement_ids: [], source_refs: [ { id: af844c8a-a98c-4536-a079-9c3850131ac0, revision: 4 }, { id: cb35a1e8-060e-42e4-8c28-60ad70a62cfe, revision: 4 }, { id: 46a5c10d-ab18-46b4-a84a-ee8d157bbce1, revision: 4 }, { id: 8b29ebc5-a302-4e79-a27b-59879800f089, revision: 4 }, { id: 937f6424-570a-473f-a7e2-ceaa13487116, revision: 4 }, { id: e045c602-8bab-498f-91bd-3622a53663e9, revision: 3 }, { id: 4912a7e6-b29b-425f-92db-0e3e455524d3, revision: 5 }, { id: 517443b8-de9a-4250-948c-a57448b9d10b, revision: 2 }, { id: 9c299212-832f-476d-9022-93e2f10931e4, revision: 3 } ] }, { item_index: 63, item_key: requirement:REQ-010, verdict: covered, explanation: "The requested analogous unload HTTP operation, one-model serialized policy and later deferral justify completed/idempotent allocation reclamation, no file/policy deletion or active interruption, and V1 404.", requirement_ids: [], source_refs: [ { id: af844c8a-a98c-4536-a079-9c3850131ac0, revision: 4 }, { id: cb35a1e8-060e-42e4-8c28-60ad70a62cfe, revision: 4 }, { id: 46a5c10d-ab18-46b4-a84a-ee8d157bbce1, revision: 4 }, { id: 937f6424-570a-473f-a7e2-ceaa13487116, revision: 4 }, { id: e045c602-8bab-498f-91bd-3622a53663e9, revision: 3 }, { id: 4912a7e6-b29b-425f-92db-0e3e455524d3, revision: 5 }, { id: 517443b8-de9a-4250-948c-a57448b9d10b, revision: 2 }, { id: 9c299212-832f-476d-9022-93e2f10931e4, revision: 3 } ] }, { item_index: 64, item_key: requirement:REQ-011, verdict: covered, explanation: The one-at-a-time queue answer and configurable bounds justify FIFO/capacity/deadline behavior. Safe active cancellation/recovery and no silent completed-inference retry are required to preserve shared resident state and synchronous failure integrity., requirement_ids: [], source_refs: [ { id: cca9871d-4ecd-4e6b-820b-8c3944e5c247, revision: 4 }, { id: 1faa0f88-4142-4d63-8e04-0399a762aa13, revision: 2 }, { id: 4912a7e6-b29b-425f-92db-0e3e455524d3, revision: 5 } ] }, { item_index: 65, item_key: requirement:REQ-012, verdict: covered, explanation: OpenAI-compatible synchronous client/JSON-text choices and conventional public API assumptions justify typed multipart/audio/error behavior; later fixed-model selection rejects per-request switching. Content/size/duration validation protects the explicit audio boundary without claiming unrequested streaming., requirement_ids: [], source_refs: [ { id: 137b4edb-c35e-41b2-9e01-1303aa63a110, revision: 3 }, { id: e187f63b-53e7-4b0e-adb2-519fef009a5d, revision: 3 }, { id: 79dc777b-1258-4a80-ae5c-a920d7394dad, revision: 4 }, { id: 1faa0f88-4142-4d63-8e04-0399a762aa13, revision: 2 }, { id: 4912a7e6-b29b-425f-92db-0e3e455524d3, revision: 5 }, { id: c7a90a22-a5c0-4a7c-ab6f-2ca23802fc96, revision: 2 }, { id: 9c299212-832f-476d-9022-93e2f10931e4, revision: 3 }, { id: bf8b57ea-5324-441f-89d5-1576508052be, revision: 3 } ] }, { item_index: 66, item_key: requirement:REQ-013, verdict: covered, explanation: "Synchronous compatible clients, explicit private HTTP wrapper and paired Pods justify adapted success/error contracts and backend isolation. Input/readiness/failure status rules and no cross-request carryover protect the confirmed reusable native context; later REQ-030 adds a distinct admission 429 cause.", requirement_ids: [], source_refs: [ { id: 137b4edb-c35e-41b2-9e01-1303aa63a110, revision: 3 }, { id: e187f63b-53e7-4b0e-adb2-519fef009a5d, revision: 3 }, { id: d9791931-ae19-42e3-a0d1-6b09aa7d97f6, revision: 4 }, { id: 4912a7e6-b29b-425f-92db-0e3e455524d3, revision: 5 }, { id: c7a90a22-a5c0-4a7c-ab6f-2ca23802fc96, revision: 2 }, { id: 9c299212-832f-476d-9022-93e2f10931e4, revision: 3 }, { id: 3887035f-9022-4e35-90a3-d69842dd97f5, revision: 3 } ] }, { item_index: 67, item_key: requirement:REQ-014, verdict: covered, explanation: The transcript/health-only choice and conventional health paths justify separate responsive liveness and loaded-compatible-backend readiness. Probes do not infer or load; dependency loss/shutdown and unready recovery reflect native startup/shared instance ownership., requirement_ids: [], source_refs: [ { id: e045c602-8bab-498f-91bd-3622a53663e9, revision: 3 }, { id: 4912a7e6-b29b-425f-92db-0e3e455524d3, revision: 5 }, { id: 9c299212-832f-476d-9022-93e2f10931e4, revision: 3 } ] }, { item_index: 68, item_key: requirement:REQ-015, verdict: covered, explanation: "Original packaging, explicit separate API/native images, Go/Echo choice, amd64/GPU boundary, both artifact modes and mandatory local acceptance justify the two images and standalone recipe. Least privilege/immutable identity/no embedded credentials are relevant package security outcomes.", requirement_ids: [], source_refs: [ { id: bb071790-6490-4706-99c2-502fd1467ae7, revision: 2 }, { id: c441aa83-7b3f-4a11-a693-682a9aa41e5a, revision: 4 }, { id: 1b0c4947-2eae-498f-9a29-109b617654ed, revision: 2 }, { id: 8a9ad115-c042-4681-b376-46ba5c398219, revision: 3 }, { id: 8832037d-89fa-48ee-8040-4e070c6a330f, revision: 3 }, { id: e3f2179a-225b-4c41-87a1-d7cd4b89c593, revision: 4 }, { id: 4912a7e6-b29b-425f-92db-0e3e455524d3, revision: 5 }, { id: c7a90a22-a5c0-4a7c-ab6f-2ca23802fc96, revision: 2 }, { id: 517443b8-de9a-4250-948c-a57448b9d10b, revision: 2 }, { id: c6d342d9-11c3-4b25-912b-d92762785da5, revision: 3 }, { id: 36576abe-603a-451d-8a2c-e5a1f9e92215, revision: 2 }, { id: 1b92f196-e1d9-43fd-b2d1-a9c351c5da8b, revision: 3 }, { id: c5d54f80-6d8c-47b3-948f-052dfe7996c5, revision: 3 } ] }, { item_index: 69, item_key: requirement:REQ-016, verdict: covered, explanation: "The chart/NVIDIA goal, existing infrastructure, separate dedicated Pods, public internal Service/optional Ingress, prepared/cache support and mandatory Home Lab/Helm matrix justify complete deployment controls. No auth/infrastructure/autoscaling or shared model state is introduced.", requirement_ids: [], source_refs: [ { id: bb071790-6490-4706-99c2-502fd1467ae7, revision: 2 }, { id: c441aa83-7b3f-4a11-a693-682a9aa41e5a, revision: 4 }, { id: 3ee8e2bc-0cdf-4761-845a-870d431a3f8f, revision: 3 }, { id: 8832037d-89fa-48ee-8040-4e070c6a330f, revision: 3 }, { id: d9791931-ae19-42e3-a0d1-6b09aa7d97f6, revision: 4 }, { id: e6008465-f7cd-4af1-8eb8-6723605f5eae, revision: 5 }, { id: e9638bb0-e355-4535-92de-71b03f99c669, revision: 3 }, { id: 4912a7e6-b29b-425f-92db-0e3e455524d3, revision: 5 }, { id: c7a90a22-a5c0-4a7c-ab6f-2ca23802fc96, revision: 2 }, { id: 517443b8-de9a-4250-948c-a57448b9d10b, revision: 2 }, { id: c6d342d9-11c3-4b25-912b-d92762785da5, revision: 3 }, { id: 3887035f-9022-4e35-90a3-d69842dd97f5, revision: 3 } ] }, { item_index: 70, item_key: requirement:REQ-017, verdict: covered, explanation: "Both model-file sources, bounded shutdown assumption and dedicated paired Pods justify lifecycle/cancellation/recovery and cache preservation. Single-GPU deployment makes stop-before-replacement/downtime material; model data ownership makes retain-on-uninstall/default disposal policy necessary.", requirement_ids: [], source_refs: [ { id: 8832037d-89fa-48ee-8040-4e070c6a330f, revision: 3 }, { id: 1faa0f88-4142-4d63-8e04-0399a762aa13, revision: 2 }, { id: 3887035f-9022-4e35-90a3-d69842dd97f5, revision: 3 } ] }, { item_index: 71, item_key: requirement:REQ-018, verdict: covered, explanation: "Requested modes/model-weight cleanup and later Resident amendment justify measured stable resident reuse, transient API/file cleanup and true terminal allocation release. The separately evidenced native-result permission is bounded and tested for isolation; future stronger per-transition reclamation remains retained without becoming a V1 gate.", requirement_ids: [], source_refs: [ { id: af844c8a-a98c-4536-a079-9c3850131ac0, revision: 4 }, { id: cb35a1e8-060e-42e4-8c28-60ad70a62cfe, revision: 4 }, { id: 001c0763-ff41-47d6-ae3c-9b0fe209d7ad, revision: 4 }, { id: 1faa0f88-4142-4d63-8e04-0399a762aa13, revision: 2 }, { id: 4912a7e6-b29b-425f-92db-0e3e455524d3, revision: 5 }, { id: 517443b8-de9a-4250-948c-a57448b9d10b, revision: 2 }, { id: c6d342d9-11c3-4b25-912b-d92762785da5, revision: 3 }, { id: f92f0134-e91a-4975-b5c3-9e35a29d4e34, revision: 2 }, { id: bcdd4fcc-9e20-491e-82d7-9ae2d002c208, revision: 2 } ] }, { item_index: 72, item_key: requirement:REQ-019, verdict: covered, explanation: "The explicit no-auth-first-release answer is preserved without hidden required keys or proxy auth. Public/private boundaries, untrusted audio/artifact handling and corrected native-retention assumption justify least privilege, redaction/no durable content, bounded request cleanup and safe abrupt-kill storage handling.", requirement_ids: [], source_refs: [ { id: d9791931-ae19-42e3-a0d1-6b09aa7d97f6, revision: 4 }, { id: e6008465-f7cd-4af1-8eb8-6723605f5eae, revision: 5 }, { id: e045c602-8bab-498f-91bd-3622a53663e9, revision: 3 }, { id: f92f0134-e91a-4975-b5c3-9e35a29d4e34, revision: 2 }, { id: bcdd4fcc-9e20-491e-82d7-9ae2d002c208, revision: 2 } ] }, { item_index: 73, item_key: requirement:REQ-020, verdict: covered, explanation: "The explicit two-environment GPU answer, upstream-source compatibility and current versions c