e and prepared read-only mounted files are supported, including offline startup, integrity and missing-file failure without unexpected substitution.", requirement_ids: [ REQ-004, REQ-005, REQ-015, REQ-016, REQ-017 ], source_refs: [] }, { item_index: 17, item_key: source:d269e73c-cea0-483c-9a83-0bf783e010be, verdict: covered, explanation: Future per-model memory/warmup policy and global defaults are preserved; V1 rejects deferred settings instead of silently ignoring them., requirement_ids: [ REQ-003, REQ-008, REQ-021, REQ-022 ], source_refs: [ { id: 517443b8-de9a-4250-948c-a57448b9d10b, revision: 2 } ] }, { item_index: 18, item_key: source:46a5c10d-ab18-46b4-a84a-ee8d157bbce1, verdict: covered, explanation: "HTTP warmup/unload methods and their request, completion, idempotency and serialization semantics are retained future work; V1 consistently returns 404 without mutation.", requirement_ids: [ REQ-009, REQ-010, REQ-021, REQ-022 ], source_refs: [ { id: 517443b8-de9a-4250-948c-a57448b9d10b, revision: 2 } ] }, { item_index: 19, item_key: source:d9791931-ae19-42e3-a0d1-6b09aa7d97f6, verdict: covered, explanation: The chart supplies internal Service by default and optional disabled Ingress with TLS/controller configuration. Only the public API may be exposed; backend privacy and the absence of identity controls are stated., requirement_ids: [ REQ-013, REQ-016, REQ-019 ], source_refs: [] }, { item_index: 20, item_key: source:e6008465-f7cd-4af1-8eb8-6723605f5eae, verdict: covered, explanation: "V1 authorization is explicitly deferred, with reachable callers allowed to transcribe. Required future access issuance/administration, possible admin interface and Prometheus metrics preserve the requested certainty.", requirement_ids: [ REQ-016, REQ-019, REQ-021, REQ-022 ], source_refs: [] }, { item_index: 21, item_key: source:001c0763-ff41-47d6-ae3c-9b0fe209d7ad, verdict: covered, explanation: The retained future ram-cache contract keeps only the last model's reusable RAM weight